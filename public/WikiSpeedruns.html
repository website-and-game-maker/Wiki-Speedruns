/* The game: pre-game lobby, the run itself, and the post-run comparison with Six Degrees. */
(function (root) {
  const WS = (root.WS = root.WS || {});
  const U = WS.util;
  const C = WS.ui;
  const esc = U.esc;
  const V = (WS.views = WS.views || {});

  // ======================================================================
  // Lobby: #/play?mode=daily|random|custom&start=..&target=..&date=..
  // ======================================================================

  V.play = async (el, params) => {
    const mode = params.mode || (params.start ? 'custom' : 'random');
    const date = params.date || U.todayKey();
    let start = params.start;
    let target = params.target;

    if (mode === 'daily') [start, target] = WS.articles.dailyPair(date);
    if (!start || !target) {
      [start, target] = WS.articles.pickPair();
      WS.app.replaceRoute('play', { mode, start, target });
      return;
    }

    const settings = WS.store.settings();
    const isDaily = mode === 'daily';
    const title = isDaily ? `Daily Challenge #${U.dailyNumber(date)}` : mode === 'random' ? 'Random Challenge' : 'Custom Challenge';
    el.innerHTML = `
      <div class="card" style="max-width:860px;margin:0 auto">
        <div class="row" style="margin-bottom:6px">
          <span class="pill ${isDaily ? 'pill-hot' : 'pill-accent'}">${isDaily ? '📅' : mode === 'random' ? '🎲' : '🎯'} ${esc(title)}</span>
          <span id="rank-pill"></span>
          <span class="spacer"></span>
          <span id="par-pill"></span>
        </div>
        <h1 class="serif" style="margin:8px 0 14px;font-size:clamp(1.5rem,4vw,2.1rem)">Get from <span id="h-start">${esc(start)}</span> to <span id="h-target" style="color:var(--hot)">${esc(target)}</span></h1>
        <div class="daily" id="cards">${C.pageCardSkeleton('Start')}<div class="arrow">→</div>${C.pageCardSkeleton('Target', true)}</div>
        <p id="target-extract" class="muted small" style="margin:0 0 18px"></p>
        <div class="row">
          <button class="btn btn-hot btn-lg" id="go" disabled>▶ Start run</button>
          ${mode === 'random' ? '<button class="btn" id="reroll">🎲 New pair</button>' : ''}
          ${mode !== 'daily' ? '<button class="btn" id="swap">⇄ Swap</button>' : ''}
          <button class="btn btn-ghost" id="share">🔗 Challenge a friend</button>
        </div>
        <p class="muted tiny" style="margin:16px 0 0">Rules: only click links inside the article. ${settings.allowBack ? '<b>Back</b> is on — it costs a click and takes this run out of ranked contention.' : 'No takebacks — once you click, that\'s it.'} ${settings.allowFind ? 'Searching (Ctrl+F) is on — it also takes this run out of ranked contention.' : 'No searching — Ctrl+F is blocked.'} The timer pauses while pages load, so slow internet doesn't hurt you. <a href="#/account">Change in Settings</a></p>
      </div>`;

    const $ = (s) => U.$(s, el);
    const ctrl = new AbortController();

    // Ranked?
    let ranked = false;
    if (isDaily) {
      const local = WS.store.dailyAttempt(date);
      ranked = date === U.todayKey() && !local;
      const setPill = () =>
        ($('#rank-pill').innerHTML = ranked
          ? `<span class="pill pill-good">🏆 Ranked — first attempt counts</span>`
          : `<span class="pill">Practice (unranked)</span>`);
      setPill();
      WS.fb.ready.then(async (ok) => {
        if (!ok || !WS.fb.user || !ranked) return;
        const entry = await WS.fb.myDailyEntry(date).catch(() => null);
        if (entry) {
          ranked = false;
          setPill();
        }
      });
    }

    // Resolve + describe both pages.
    let info;
    try {
      info = await WS.wiki.pageInfo([start, target], { extract: true, thumbSize: 240, signal: ctrl.signal });
    } catch (e) {
      $('#cards').innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="e">📡</div>Couldn't reach Wikipedia: ${esc(e.message)}<br><br><button class="btn" onclick="location.reload()">Retry</button></div>`;
      return;
    }
    const si = info.get(start);
    const ti = info.get(target);
    if (si.missing || ti.missing) {
      $('#cards').innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="e">🤷</div>“${esc(si.missing ? start : target)}” isn't a Wikipedia article.<br><br><a class="btn" href="#/">Back home</a></div>`;
      return;
    }
    start = si.title;
    target = ti.title;
    $('#h-start').textContent = start;
    $('#h-target').textContent = target;
    $('#cards').innerHTML = `${C.pageCard(si, { label: 'Start', big: true })}<div class="arrow">→</div>${C.pageCard(ti, { label: 'Target', big: true, target: true })}`;
    $('#target-extract').innerHTML = ti.extract ? `<b>About the target:</b> ${esc(ti.extract)}` : '';
    if (start === target) {
      $('#target-extract').innerHTML = '<b>Start and target are the same article.</b> Pick another pair.';
      return;
    }
    const go = $('#go');
    go.disabled = false;
    go.focus();

    // Par (optimal clicks) in the background; shown only if the setting is on.
    const parPromise = WS.sdow.distance(start, target, { signal: ctrl.signal }).catch(() => null);
    if (WS.store.settings().showPar) {
      parPromise.then((d) => d && d.degrees != null && ($('#par-pill').innerHTML = `<span class="pill pill-warn" title="Shortest possible path, from Six Degrees of Wikipedia">⛳ Par ${d.degrees}</span>`));
    }

    go.onclick = () => {
      if (isDaily && ranked) WS.store.setDailyAttempt(date, { id: 'pending', finished: false });
      startRun(el, { mode, date: isDaily ? date : null, ranked, start, target, targetInfo: ti, startInfo: si });
    };
    const reroll = $('#reroll');
    if (reroll) reroll.onclick = () => WS.app.go('play', { mode: 'random', ...pairObj(WS.articles.pickPair()) });
    const swap = $('#swap');
    if (swap) swap.onclick = () => WS.app.go('play', { mode, start: target, target: start });
    $('#share').onclick = () => shareChallenge(start, target, isDaily ? date : null);

    return () => ctrl.abort();
  };

  const pairObj = ([start, target]) => ({ start, target });

  function challengeUrl(start, target) {
    const base = /^https?:/.test(location.protocol) ? location.origin + location.pathname : 'https://wiki-speedruns.web.app/';
    return `${base}#/play?mode=custom&start=${encodeURIComponent(start)}&target=${encodeURIComponent(target)}`;
  }

  async function shareChallenge(start, target, date, extra = '') {
    const url = date ? `https://wiki-speedruns.web.app/#/play?mode=daily` : challengeUrl(start, target);
    const text = `Can you get from ${start} to ${target} on Wikipedia?${extra}`;
    if (navigator.share) {
      try {
        await navigator.share({ title: 'WikiSpeedruns challenge', text, url });
        return;
      } catch (e) {
        if (e.name === 'AbortError') return;
      }
    }
    if (await U.copy(`${text}\n${url}`)) U.toast('Challenge link copied!', 'good');
  }

  // ======================================================================
  // The run
  // ======================================================================

  function startRun(el, cfg) {
    const s = {
      ...cfg,
      id: U.id(),
      path: [{ title: cfg.start }],
      stack: [cfg.start],
      clicks: 0,
      backs: 0,
      hints: 0,
      finds: 0,
      activeMs: 0,
      segStart: null,
      loading: false,
      done: false,
      navToken: 0,
    };
    const hideRefs = WS.store.settings().hideRefs;
    const allowBack = WS.store.settings().allowBack;
    const allowFind = WS.store.settings().allowFind;

    document.body.classList.add('in-game');
    WS.app.guard = () => s.done || confirm('Leave this run? It will not be saved.');
    el.innerHTML = `
      <div class="hud">
        <div class="hud-main">
          <button class="icon-btn" id="quit" title="Give up">✕</button>
          <button class="hud-target" id="peek" title="About the target">
            ${C.thumb(cfg.targetInfo)}
            <div><div class="lbl">Target</div><div class="t">${esc(cfg.target)}</div></div>
          </button>
          <div class="hud-stat"><div class="v" id="clicks">0</div><div class="k">Clicks</div></div>
          <div class="hud-stat"><div class="v" id="timer">0:00.0</div><div class="k">Time</div></div>
          ${allowBack ? '<button class="btn btn-sm" id="back" title="Go back (costs a click) — Alt+←" disabled>←<span class="hide-sm"> Back</span></button>' : ''}
          ${cfg.ranked ? '' : '<button class="btn btn-sm" id="hint" title="Ask Six Degrees for a hint">💡<span class="hide-sm"> Hint</span></button>'}
        </div>
        <div class="hud-crumbs" id="crumbs"></div>
        <div class="loadbar" id="loadbar"></div>
      </div>
      <div class="article-wrap">
        <h1 class="article-title" id="a-title"></h1>
        <div class="redirect-note" id="a-redirect"></div>
        <div class="wiki ${hideRefs ? 'ws-no-refs' : ''}" id="article"></div>
      </div>`;
    const $ = (sel) => U.$(sel, el);
    const article = $('#article');

    // ---- timer: runs only while an article is on screen ----
    const now = () => performance.now();
    const elapsed = () => s.activeMs + (s.segStart != null ? now() - s.segStart : 0);
    const pause = () => {
      if (s.segStart != null) s.activeMs += now() - s.segStart;
      s.segStart = null;
    };
    const resume = () => {
      if (s.segStart == null && !s.done) s.segStart = now();
    };
    const tick = setInterval(() => ($('#timer').textContent = U.fmtTime(elapsed())), 100);
    const backBtn = allowBack ? $('#back') : null;

    const drawCrumbs = () => {
      $('#clicks').textContent = s.clicks;
      if (backBtn) backBtn.disabled = s.stack.length < 2 || s.done;
      const items = s.path.map((p, i) => `<span class="crumb ${i === s.path.length - 1 ? 'cur' : ''} ${p.back ? 'back' : ''}">${p.back ? '↩ ' : ''}${esc(p.title)}</span>`);
      $('#crumbs').innerHTML = items.join('<span class="crumb-sep">›</span>');
      const c = $('#crumbs');
      c.scrollLeft = c.scrollWidth;
    };

    // ---- article loading ----
    const loadbar = $('#loadbar');
    async function show(title, { fragment, onLoaded } = {}) {
      const token = ++s.navToken;
      s.loading = true;
      pause();
      loadbar.className = 'loadbar';
      void loadbar.offsetWidth;
      loadbar.className = 'loadbar on';
      let a;
      try {
        a = await WS.wiki.article(title);
      } catch (e) {
        if (token === s.navToken) {
          s.loading = false;
          loadbar.className = 'loadbar';
          resume();
          U.toast(e.code === 'missingtitle' ? `“${title}” doesn't exist.` : `Couldn't load “${title}”: ${e.message}`, 'bad');
        }
        return null;
      }
      if (token !== s.navToken || s.done) return null;
      onLoaded && onLoaded(a);
      $('#a-title').innerHTML = a.displayTitle;
      $('#a-redirect').textContent = a.redirectedFrom ? `(Redirected from ${a.redirectedFrom})` : '';
      article.replaceChildren(renderArticle(a.html));
      loadbar.className = 'loadbar done';
      s.loading = false;
      if (fragment) {
        const target = document.getElementById(fragment.replace(/ /g, '_'));
        if (target) target.scrollIntoView();
        else window.scrollTo(0, 0);
      } else window.scrollTo(0, 0);
      drawCrumbs();
      if (U.normTitle(a.title) === U.normTitle(s.target)) finish(true);
      else resume();
      return a;
    }

    async function follow(title, fragment) {
      if (s.loading || s.done) return;
      const shown = await show(title, {
        fragment,
        // Count the click only once the page actually loads (a failed load is free).
        onLoaded: (a) => {
          s.clicks++;
          s.path.push({ title: a.title });
          s.stack.push(a.title);
        },
      });
      return shown;
    }

    async function back() {
      if (!allowBack || s.loading || s.done || s.stack.length < 2) return;
      const prev = s.stack[s.stack.length - 2];
      await show(prev, {
        onLoaded: (a) => {
          s.stack.pop();
          s.clicks++;
          s.backs++;
          s.path.push({ title: a.title, back: true });
        },
      });
    }

    // ---- link handling ----
    const activate = (a) => {
      if (a.classList.contains('ws-anchor')) {
        const id = decodeURIComponent((a.getAttribute('data-anchor') || '').replace(/^#/, ''));
        const t = id && document.getElementById(id);
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      if (a.classList.contains('ws-link')) follow(a.dataset.title, a.dataset.frag || null);
    };
    article.addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (!a) return;
      e.preventDefault();
      activate(a);
    });
    article.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const a = e.target.closest && e.target.closest('a.ws-link, a.ws-anchor');
        if (a) activate(a);
      }
    });
    const onKey = (e) => {
      if (e.target.matches && e.target.matches('input, textarea')) return;
      if (allowBack && ((e.altKey && e.key === 'ArrowLeft') || (e.key === 'Backspace' && !e.metaKey && !e.ctrlKey))) {
        e.preventDefault();
        back();
      }
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'f' || e.key === 'F')) {
        if (!allowFind) {
          e.preventDefault();
          U.toast('Searching is off — turn it on in Settings if you want it.');
        } else {
          s.finds++;
        }
      }
    };
    document.addEventListener('keydown', onKey);
    const onUnload = (e) => {
      if (!s.done) {
        e.preventDefault();
        e.returnValue = '';
      }
    };
    window.addEventListener('beforeunload', onUnload);

    if (backBtn) backBtn.onclick = back;
    $('#peek').onclick = () => {
      const t = cfg.targetInfo;
      U.modal(`<div class="label pill pill-hot">🎯 Target</div>
        <h2 style="margin-top:10px">${esc(t.title)}</h2>
        ${t.thumb ? `<img src="${esc(t.thumb)}" alt="" style="float:right;max-width:120px;border-radius:10px;margin:0 0 8px 12px">` : ''}
        <p class="muted">${esc(t.description)}</p><p>${esc(t.extract)}</p>
        <div style="clear:both"></div>
        <p class="muted small">You're at <b>${esc(s.stack[s.stack.length - 1])}</b> after ${U.plural(s.clicks, 'click')}.</p>`);
    };
    $('#quit').onclick = () => {
      if (s.done) return;
      const m = U.modal(`<h2>Give up?</h2><p class="muted">Your run ends here. You'll still see the shortest paths and how close you got.</p>
        <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-x>Keep going</button><button class="btn btn-hot" data-quit>Give up</button></div>`);
      m.el.querySelector('[data-x]').onclick = m.close;
      m.el.querySelector('[data-quit]').onclick = () => {
        m.close();
        finish(false);
      };
    };
    const hintBtn = $('#hint');
    if (hintBtn) hintBtn.onclick = () => hint();

    async function hint() {
      const cur = s.stack[s.stack.length - 1];
      const box = document.createElement('div');
      box.className = 'hint-box';
      box.innerHTML = '<span class="spinner"></span> Asking Six Degrees of Wikipedia…';
      el.appendChild(box);
      const closeBox = () => box.remove();
      try {
        const d = await WS.sdow.distance(cur, s.target);
        if (s.done) return closeBox();
        s.hints++;
        if (d.degrees == null) {
          box.innerHTML = `No path from <b>${esc(cur)}</b> to the target in the Six Degrees database. Go back!`;
        } else {
          const links = U.$$('a.ws-link', article).filter((a) => d.next.includes(a.dataset.title));
          links.forEach((a) => a.classList.add('ws-hint'));
          const names = [...new Set(links.map((a) => a.dataset.title))];
          box.innerHTML = `You're <b>${U.plural(d.degrees, 'click')}</b> away.<br>${
            names.length
              ? `Best link${names.length > 1 ? 's' : ''} here: ${names.slice(0, 3).map((n) => `<b>${esc(n)}</b>`).join(', ')}
                 <div class="row" style="margin-top:8px"><button class="btn btn-sm btn-primary" data-show>Show me</button><button class="btn btn-sm" data-x>Close</button></div>`
              : 'The best next links aren’t visible on this version of the page. <button class="btn btn-sm" data-x>Close</button>'
          }`;
          const show = box.querySelector('[data-show]');
          if (show) show.onclick = () => links[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        const x = box.querySelector('[data-x]');
        if (x) x.onclick = closeBox;
        setTimeout(closeBox, 15000);
      } catch (e) {
        box.textContent = 'Hint unavailable: ' + e.message;
        setTimeout(closeBox, 4000);
      }
    }

    async function finish(won) {
      if (s.done) return;
      pause();
      s.done = true;
      clearInterval(tick);
      $('#timer').textContent = U.fmtTime(s.activeMs);
      drawCrumbs();
      const run = {
        v: 1,
        id: s.id,
        mode: s.mode,
        date: s.date,
        ranked: !!s.ranked && s.hints === 0 && s.backs === 0 && s.finds === 0,
        start: s.start,
        target: s.target,
        path: s.path,
        clicks: s.clicks,
        backs: s.backs,
        hints: s.hints,
        finds: s.finds,
        timeMs: Math.round(s.activeMs),
        finished: won,
        optimal: null,
        createdAt: Date.now(),
      };
      if (run.date && s.ranked) WS.store.setDailyAttempt(run.date, run);
      await WS.store.saveRun(run);
      if (run.date && run.ranked) {
        // Optimal distance goes on the leaderboard entry if we already know it.
        const d = await Promise.race([WS.sdow.distance(run.start, run.target).catch(() => null), U.sleep(2500)]);
        if (d && d.degrees != null) run.optimal = d.degrees;
        WS.fb.submitDaily(run.date, run).then((r) => {
          if (r === 'ok') U.toast('Submitted to the daily leaderboard!', 'good');
          else if (r === 'exists') U.toast('Already on today’s leaderboard — this one is practice.');
        });
      }
      if (won) C.confetti();
      WS.app.go('run', { id: run.id, fresh: '1' });
    }

    history.pushState({ wsRunTrap: s.id }, '', location.href);
    const onPopState = () => {
      if (!s.done) history.pushState({ wsRunTrap: s.id }, '', location.href);
    };
    window.addEventListener('popstate', onPopState);

    drawCrumbs();
    show(cfg.start);

    WS.app.addCleanup(() => {
      clearInterval(tick);
      WS.app.guard = null;
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('beforeunload', onUnload);
      window.removeEventListener('popstate', onPopState);
      document.body.classList.remove('in-game');
      s.navToken++;
    });
  }

  /** Turn parser HTML into a safe, playable DOM fragment. */
  function renderArticle(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script, link, meta, iframe, object, embed, form, input, button, noscript, .mw-editsection, .navbar, #coordinates').forEach((n) => n.remove());
    for (const n of doc.body.querySelectorAll('*')) {
      for (const attr of [...n.attributes]) {
        if (/^on/i.test(attr.name) || /^\s*javascript:/i.test(attr.value)) n.removeAttribute(attr.name);
      }
    }
    for (const img of doc.querySelectorAll('img')) {
      const src = img.getAttribute('src');
      if (src && src.startsWith('//')) img.setAttribute('src', 'https:' + src);
      const srcset = img.getAttribute('srcset');
      if (srcset) img.setAttribute('srcset', srcset.replace(/(^|,\s*)\/\//g, '$1https://'));
      img.setAttribute('loading', 'lazy');
      img.setAttribute('decoding', 'async');
    }
    for (const a of doc.querySelectorAll('a')) {
      const href = a.getAttribute('href');
      a.removeAttribute('href');
      a.removeAttribute('target');
      if (href && href.startsWith('#')) {
        a.className = 'ws-anchor';
        a.setAttribute('data-anchor', href);
        a.setAttribute('tabindex', '0');
        continue;
      }
      const t = a.classList.contains('new') || a.classList.contains('extiw') || a.classList.contains('external') ? null : WS.wiki.linkTarget(href);
      if (t) {
        a.classList.add('ws-link');
        a.dataset.title = t.title;
        if (t.fragment) a.dataset.frag = t.fragment;
        a.setAttribute('role', 'link');
        a.setAttribute('tabindex', '0');
      } else {
        a.classList.add('ws-dead');
      }
    }
    const frag = document.createDocumentFragment();
    frag.append(...doc.body.childNodes);
    return frag;
  }
  WS.game = { renderArticle };

  // ======================================================================
  // Results: #/run?id=..  — your path vs Six Degrees of Wikipedia
  // ======================================================================

  V.run = async (el, params) => {
    let run = WS.store.getRun(params.id);
    if (!run) {
      el.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
      await WS.fb.ready;
      const all = await WS.store.allRuns();
      run = all.find((r) => r.id === params.id);
    }
    if (!run) {
      el.innerHTML = `<div class="empty"><div class="e">🔍</div>Run not found.<br><br><a class="btn" href="#/history">Your runs</a></div>`;
      return;
    }
    const ctrl = new AbortController();
    const fresh = params.fresh === '1';
    const won = run.finished;
    const titleLine = won
      ? ['🏁', 'You made it!']
      : ['🏳️', 'Run abandoned'];
    const modeLabel = run.date ? `Daily #${U.dailyNumber(run.date)}` : run.mode === 'random' ? 'Random' : 'Custom';

    el.innerHTML = `
      <div class="win-banner">
        <div class="big">${titleLine[0]}</div>
        <h1>${titleLine[1]}</h1>
        <div class="muted">${esc(run.start)} → ${esc(run.target)} · ${esc(modeLabel)}${run.ranked ? ' · <span class="pill pill-good">Ranked</span>' : ''}${run.hints ? ` · <span class="pill pill-warn">💡 ${U.plural(run.hints, 'hint')}</span>` : ''}${run.backs ? ` · <span class="pill pill-warn">↩ ${U.plural(run.backs, 'back')}</span>` : ''}${run.finds ? ` · <span class="pill pill-warn">🔍 ${U.plural(run.finds, 'search', 'searches')}</span>` : ''}</div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="row" style="justify-content:center;margin-bottom:22px">
        <button class="btn btn-hot" id="again">↻ Play again</button>
        <a class="btn" href="#/play?mode=random">🎲 New random</a>
        ${run.date ? `<a class="btn" href="#/leaderboard?date=${run.date}">🏆 Leaderboard</a>` : ''}
        <button class="btn" id="share">📤 Share result</button>
      </div>
      <div class="grid grid-2" style="align-items:start">
        <div class="card">
          <h2>Your route</h2>
          <div class="legend" style="margin-bottom:12px"><span>Number = clicks left to the target (per Six Degrees)</span></div>
          <ol class="route" id="route"></ol>
        </div>
        <div class="grid">
          <div class="card"><h2>Distance to target</h2><div id="chart"><div class="skeleton" style="height:180px"></div></div></div>
          <div class="card" id="verdict-card"><h2>Verdict</h2><div id="verdict" class="muted"><span class="spinner"></span> Comparing with Six Degrees of Wikipedia…</div></div>
        </div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="row" style="margin-bottom:10px"><h2 style="margin:0">Six Degrees of Wikipedia: the shortest paths</h2><span class="spacer"></span><span id="sd-meta" class="muted small"></span></div>
        <div id="sd"><div class="progress"><div></div></div></div>
      </div>`;
    const $ = (s) => U.$(s, el);

    const drawStats = () => {
      const eff = run.optimal && won ? Math.min(100, Math.round((run.optimal / run.clicks) * 100)) : null;
      $('#stats').innerHTML = `
        <div class="stat hot"><div class="k">Time</div><div class="v">${U.fmtTime(run.timeMs)}</div></div>
        <div class="stat"><div class="k">Clicks</div><div class="v">${run.clicks}</div>${run.backs ? `<div class="sub">${U.plural(run.backs, 'back')}</div>` : ''}</div>
        <div class="stat"><div class="k">Optimal</div><div class="v">${run.optimal ?? '<span class="spinner"></span>'}</div><div class="sub">clicks</div></div>
        <div class="stat ${eff === 100 ? 'good' : ''}"><div class="k">Efficiency</div><div class="v">${eff != null ? eff + '%' : '–'}</div>${eff === 100 ? '<div class="sub">⭐ Perfect route</div>' : ''}</div>`;
    };
    drawStats();

    $('#again').onclick = () => WS.app.go('play', { mode: run.date ? 'daily' : 'custom', date: run.date || undefined, start: run.date ? undefined : run.start, target: run.date ? undefined : run.target });

    // ---- Route timeline with distances ----
    const steps = run.path;
    const dists = steps.map(() => undefined);
    const nexts = steps.map(() => null);
    const drawRoute = () => {
      $('#route').innerHTML = steps
        .map((p, i) => {
          const d = dists[i];
          const prev = i > 0 ? dists[i - 1] : undefined;
          const isEnd = i === steps.length - 1 && won;
          let cls = '';
          if (isEnd) cls = 'done';
          else if (i > 0 && d != null && prev != null) cls = d < prev ? 'closer' : d > prev ? 'further' : 'same';
          const dot = isEnd ? '🏁' : d === undefined ? '<span class="spinner" style="width:14px;height:14px"></span>' : d === null ? '?' : d;
          let note = '';
          if (i < steps.length - 1 && nexts[i] && nexts[i].length && d) {
            const took = steps[i + 1].title;
            const good = nexts[i].includes(took) && !steps[i + 1].back;
            note = good
              ? `<div class="step-note">✓ Optimal click</div>`
              : `<div class="step-note">Best from here: ${nexts[i].slice(0, 3).map((t) => `<b>${esc(t)}</b>`).join(', ')}${nexts[i].length > 3 ? ` +${nexts[i].length - 3} more` : ''}</div>`;
          }
          return `<li><div class="dot ${cls}">${dot}</div><div class="step-title"><a href="${esc(U.wikiUrl(p.title))}" target="_blank" rel="noopener">${esc(p.title)}</a>${p.back ? '<span class="back-tag">BACK</span>' : ''}${i === 0 ? '<span class="back-tag">START</span>' : ''}</div>${note}</li>`;
        })
        .join('');
    };
    drawRoute();

    const drawChart = () => {
      if (dists.some((d) => d === undefined)) return;
      const html = C.distanceChart(dists.map((d, i) => (i === steps.length - 1 && won ? 0 : d)), steps.map((p) => p.title));
      $('#chart').innerHTML = html || '<p class="muted">Not enough data from Six Degrees to chart this run.</p>';
    };

    const uniq = [...new Set(steps.map((p) => p.title))];
    const byTitle = new Map();
    U.pool(
      uniq,
      3,
      async (t) => {
        let r = null;
        try {
          r = await WS.sdow.distance(t, run.target, { signal: ctrl.signal });
        } catch (e) {
          if (e.name === 'AbortError') throw e;
        }
        byTitle.set(t, r);
        steps.forEach((p, i) => {
          if (p.title === t) {
            dists[i] = r ? r.degrees : null;
            nexts[i] = r ? r.next : null;
          }
        });
        if (!ctrl.signal.aborted) drawRoute();
      },
      { signal: ctrl.signal }
    )
      .then(() => {
        drawChart();
        drawVerdict();
      })
      .catch(() => {});

    // ---- Shortest paths from Six Degrees ----
    let sd = null;
    const mine = new Set(steps.map((p) => p.title));
    const mineEdges = new Set();
    for (let i = 1; i < steps.length; i++) mineEdges.add(steps[i - 1].title + '\u0001' + steps[i].title);

    WS.sdow
      .find(run.start, run.target, { engine: 'auto', signal: ctrl.signal })
      .then(async (r) => {
        sd = r;
        if (r.degrees != null && run.optimal !== r.degrees) {
          run.optimal = r.degrees;
          WS.store.updateRun(run.id, { optimal: r.degrees });
        }
        drawStats();
        drawShortest();
        drawVerdict();
      })
      .catch((e) => {
        if (e.name === 'AbortError') return;
        $('#sd').innerHTML = `<p class="muted">Couldn't get shortest paths: ${esc(e.message)}</p>`;
        $('#verdict').textContent = 'Six Degrees comparison unavailable right now.';
        $('#stats .stat:nth-child(3) .v').textContent = '–';
      });

    function drawShortest() {
      if (!sd) return;
      if (!sd.paths.length) {
        $('#sd').innerHTML = `<p class="muted">Six Degrees found no path from ${esc(run.start)} to ${esc(run.target)} in its snapshot.</p>`;
        return;
      }
      const shown = sd.paths.slice(0, 40);
      $('#sd-meta').innerHTML = `${U.plural(sd.totalPaths, 'path')} · ${U.plural(sd.degrees, 'degree')} · ${sd.engine === 'sdow' ? 'Six Degrees database' : 'live Wikipedia search'}`;
      $('#sd').innerHTML = `
        <div class="legend" style="margin-bottom:10px"><span><i style="background:var(--hot)"></i>Start / target</span><span><i style="background:var(--good)"></i>Pages you visited</span><span>Tap a node to trace its paths · double-click to open</span></div>
        <div class="graph-wrap" id="graph" style="max-height:520px"></div>
        ${shown.length < sd.totalPaths ? `<p class="muted tiny">Graph shows ${shown.length} of ${sd.totalPaths} paths.</p>` : ''}
        <h3 style="margin:18px 0 10px;font-size:1rem">Paths</h3>
        <div class="paths-list" id="plist"></div>
        ${sd.paths.length > 6 ? `<button class="btn btn-sm" id="more" style="margin-top:10px">Show all ${sd.paths.length}</button>` : ''}
        <div style="margin-top:14px"><a class="btn btn-sm" href="#/six-degrees?from=${encodeURIComponent(run.start)}&to=${encodeURIComponent(run.target)}">Open in Six Degrees explorer →</a></div>`;
      WS.graph.render($('#graph'), shown, { mine, mineEdges });
      const list = (n) => ($('#plist').innerHTML = sd.paths.slice(0, n).map((p, i) => C.pathRow(p, i, mine)).join(''));
      list(6);
      const more = $('#more');
      if (more) more.onclick = () => (list(sd.paths.length), more.remove());
    }

    function drawVerdict() {
      if (!sd || dists.some((d) => d === undefined)) return;
      const opt = sd.degrees;
      const v = $('#verdict');
      v.classList.remove('muted');
      if (opt == null) {
        v.innerHTML = 'Six Degrees has no route for this pair — impressive if you found one!';
        return;
      }
      let html = '';
      if (won) {
        const extra = run.clicks - opt;
        if (extra < 0) html += `<p>🤯 <b>You beat Six Degrees of Wikipedia</b> by ${U.plural(-extra, 'click')}! (Its database is a snapshot, so you used links added since.)</p>`;
        else if (extra === 0) html += `<p>⭐ <b>Perfect!</b> You found a shortest possible path — ${U.plural(opt, 'click')}.</p>`;
        else html += `<p>You took <b>${U.plural(extra, 'extra click')}</b> over the optimal ${opt}.</p>`;
      } else {
        const last = dists[dists.length - 1];
        html += `<p>You stopped <b>${last != null ? U.plural(last, 'click') : 'an unknown distance'}</b> from ${esc(run.target)}. The shortest route was ${U.plural(opt, 'click')}.</p>`;
      }
      // First wrong turn.
      let wrong = -1;
      for (let i = 0; i < steps.length - 1; i++) {
        if (dists[i] != null && dists[i + 1] != null && (dists[i + 1] >= dists[i] || steps[i + 1].back)) {
          wrong = i;
          break;
        }
      }
      if (wrong >= 0 && nexts[wrong] && nexts[wrong].length) {
        const left = Math.max(0, dists[wrong] - 1);
        html += `<p class="small">Your first wrong turn was on <b>${esc(steps[wrong].title)}</b> → ${esc(steps[wrong + 1].title)}. ${
          left === 0
            ? `<b>${esc(nexts[wrong][0])}</b> was right there — one click would have won it.`
            : `<b>${esc(nexts[wrong][0])}</b> would have left you ${U.plural(left, 'click')} from the finish.`
        }</p>`;
      } else if (won && run.clicks > opt) {
        html += '<p class="small">Every click moved you closer — the extra length came from the start.</p>';
      }
      const closer = steps.slice(1).filter((p, i) => dists[i] != null && dists[i + 1] != null && dists[i + 1] < dists[i]).length;
      html += `<p class="small muted">${closer} of ${run.clicks} clicks moved you closer.</p>`;
      if (run.date && run.ranked && won) html += `<p class="small" id="rank-line"><span class="spinner"></span></p>`;
      v.innerHTML = html;
      if (run.date && run.ranked && won) rankLine();
    }

    async function rankLine() {
      const line = $('#rank-line');
      const ok = await WS.fb.ready;
      if (!ok) return line && line.remove();
      if (!WS.fb.user) {
        line.innerHTML = `<a href="#/account">Sign in</a> to put runs like this on the daily leaderboard.`;
        return;
      }
      try {
        await U.sleep(800); // give the submission a moment to land
        const board = await WS.fb.leaderboard(run.date, 'time', 500);
        const i = board.findIndex((e) => e.uid === WS.fb.user.uid);
        line.innerHTML = i >= 0 ? `🏆 You're <b>#${i + 1}</b> of ${board.length} on today's leaderboard.` : 'Leaderboard updating…';
      } catch (e) {
        line.remove();
      }
    }

    $('#share').onclick = async () => {
      const squares = steps
        .slice(1)
        .map((p, i) => {
          if (p.back) return '⬅️';
          if (i === steps.length - 2 && won) return '🏁';
          const a = dists[i], b = dists[i + 1];
          if (a == null || b == null) return '⬜';
          return b < a ? '🟩' : b > a ? '🟥' : '🟨';
        })
        .join('');
      const head = run.date ? `WikiSpeedruns Daily #${U.dailyNumber(run.date)}` : 'WikiSpeedruns';
      const text = `${head}\n${run.start} → ${run.target}\n${won ? `⏱ ${U.fmtTime(run.timeMs)} · 🖱 ${run.clicks} clicks${run.optimal ? ` (par ${run.optimal})` : ''}` : `🏳️ gave up after ${run.clicks} clicks`}\n${squares}`;
      const url = run.date ? 'https://wiki-speedruns.web.app/#/play?mode=daily' : challengeUrl(run.start, run.target);
      const m = U.modal(`<h2>Share your run</h2><div class="share-box">${esc(text)}\n${esc(url)}</div>
        <div class="row" style="margin-top:14px;justify-content:flex-end">${navigator.share ? '<button class="btn" data-native>Share…</button>' : ''}<button class="btn btn-primary" data-copy>Copy</button></div>`);
      m.el.querySelector('[data-copy]').onclick = async () => (await U.copy(`${text}\n${url}`)) && U.toast('Copied!', 'good');
      const nat = m.el.querySelector('[data-native]');
      if (nat) nat.onclick = () => navigator.share({ text, url }).catch(() => {});
    };

    if (fresh) history.replaceState(null, '', `#/run?id=${encodeURIComponent(run.id)}`);
    return () => ctrl.abort();
  };
})(window);

</script>
  <script>
/* Home, Six Degrees explorer, history, leaderboard, account/settings, about. */
(function (root) {
  const WS = (root.WS = root.WS || {});
  const U = WS.util;
  const C = WS.ui;
  const esc = U.esc;
  const V = (WS.views = WS.views || {});

  // ======================================================================
  // Home
  // ======================================================================
  V.home = async (el) => {
    const today = U.todayKey();
    const [ds, dt] = WS.articles.dailyPair(today);
    const attempt = WS.store.dailyAttempt(today);
    const streak = WS.store.streak();
    const recent = WS.store.localRuns().slice(0, 4);

    el.innerHTML = `
      <section class="hero">
        <h1>Race through Wikipedia.</h1>
        <p>Get from one article to another using only the links inside them — as fast as you can.<span class="hide-sm"> Then see how your route stacks up against every shortest path, courtesy of <b>Six Degrees of Wikipedia</b>.</span></p>
        <div class="row"><span class="pill pill-hot">📅 Daily Challenge #${U.dailyNumber(today)}</span>${streak ? `<span class="pill pill-warn">🔥 ${streak}-day streak</span>` : ''}<span class="pill" id="players"></span></div>
        <div class="daily" id="daily-cards">${C.pageCardSkeleton('Start')}<div class="arrow">→</div>${C.pageCardSkeleton('Target', true)}</div>
        <div class="row" id="daily-actions">
          ${
            attempt && attempt.runId && attempt.runId !== 'pending'
              ? `<span class="pill ${attempt.finished ? 'pill-good' : ''}">${attempt.finished ? `✅ Done in ${U.fmtTime(attempt.timeMs)} · ${U.plural(attempt.clicks, 'click')}` : '🏳️ Attempted'}</span>
                 <a class="btn" href="#/run?id=${encodeURIComponent(attempt.runId)}">Your result</a>
                 <a class="btn" href="#/leaderboard">🏆 Leaderboard</a>
                 <a class="btn btn-ghost" href="#/play?mode=daily">Practice again</a>`
              : `<a class="btn btn-hot btn-lg" href="#/play?mode=daily">▶ Play today's challenge</a><a class="btn btn-ghost" href="#/leaderboard">🏆 Leaderboard</a>`
          }

      </section>

      <h2 class="section-title" style="margin-top:28px">More ways to play</h2>
      <div class="grid grid-3">
        <div class="card mode-card"><div class="emoji">🎲</div><h3>Random</h3><p>Two well-known articles from different corners of Wikipedia.</p><a class="btn btn-primary" href="#/play?mode=random">Play random</a></div>
        <div class="card mode-card"><div class="emoji">🌀</div><h3>Chaos mode</h3><p>Truly random articles. Obscure villages, forgotten footballers, 18th-century ships. Good luck.</p><button class="btn" id="chaos">Roll the dice</button></div>
        <div class="card mode-card"><div class="emoji">🔭</div><h3>Six Degrees explorer</h3><p>Find every shortest path between any two articles and see them as a graph.</p><a class="btn" href="#/six-degrees">Open explorer</a></div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>🎯 Custom challenge</h2>
        <div class="sd-form">
          <div><label class="field">Start</label><div class="ac"><input class="input" id="c-start" placeholder="e.g. Pizza"></div></div>
          <button class="icon-btn swap" id="c-swap" title="Swap">⇄</button>
          <div><label class="field">Target</label><div class="ac"><input class="input" id="c-target" placeholder="e.g. Albert Einstein"></div></div>
          <button class="btn btn-primary" id="c-go">Play</button>
        </div>
      </div>

      ${
        recent.length
          ? `<div class="row" style="margin:28px 0 10px"><h2 class="section-title" style="margin:0">Recent runs</h2><span class="spacer"></span><a href="#/history" class="small">All runs →</a></div>
             <div class="grid grid-2">${recent.map(runItem).join('')}</div>`
          : ''
      }`;

    const $ = (s) => U.$(s, el);
    WS.wiki.pageInfo([ds, dt]).then((info) => {
      const cards = $('#daily-cards');
      if (cards) cards.innerHTML = `${C.pageCard(info.get(ds), { label: 'Start' })}<div class="arrow">→</div>${C.pageCard(info.get(dt), { label: 'Target', target: true })}`;
    }).catch(() => {

    return `<a class="run-item" href="#/run?id=${encodeURIComponent(r.id)}">

      <div style="flex:1">
        <div class="route-t">${esc(r.start)} → ${esc(r.target)}</div>
        <div class="muted small">${r.finished ? `${U.fmtTime(r.timeMs)} · ${U.plural(r.clicks, 'click')}` : `Gave up after ${U.plural(r.clicks, 'click')}`} · ${U.relTime(r.createdAt)}</div>
      </div>${eff}</a>`;
  }

  // ======================================================================
  // Six Degrees explorer: #/six-degrees?from=..&to=..&engine=auto|sdow|live
  // ======================================================================
  V.sixDegrees = async (el, params) => {
    const engine = params.engine || 'auto';
    el.innerHTML = `
      <div style="margin-bottom:16px">
        <h1 class="serif" style="margin:0 0 4px;font-size:clamp(1.7rem,4vw,2.4rem)">Six Degrees of Wikipedia</h1>
        <p class="muted" style="margin:0">Find the shortest paths between any two articles. Built on <a href="https://github.com/jwngr/sdow" target="_blank" rel="noopener">jwngr/sdow</a>'s bi-directional breadth-first search.</p>
      </div>
      <div class="card">
        <div class="sd-form">
          <div><label class="field">From</label><div class="ac"><input class="input" id="from" placeholder="Start article" value="${esc(params.from || '')}"></div></div>
          <button class="icon-btn swap" id="swap" title="Swap">⇄</button>
          <div><label class="field">To</label><div class="ac"><input class="input" id="to" placeholder="Target article" value="${esc(params.to || '')}"></div></div>
          <button class="btn btn-primary" id="go">Find paths</button>
        </div>
        <div class="row" style="margin-top:14px">
          <span class="small muted">Engine</span>
          <div class="seg" id="engine">
            <button data-e="auto" title="Six Degrees database, falls back to live search">Auto</button>

            <button data-e="live" title="Runs the search in your browser against live Wikipedia">Live</button>
          </div>
          <span class="spacer"></span>
          <button class="btn btn-sm btn-ghost" id="surprise">🎲 Surprise me</button>
        </div>

    const $ = (s) => U.$(s, el);
    const from = $('#from'), to = $('#to'), out = $('#out');
    let eng = engine;
    const drawEngine = () => U.$$('#engine button', el).forEach((b) => b.classList.toggle('on', b.dataset.e === eng));
    drawEngine();
    U.$$('#engine button', el).forEach((b) => (b.onclick = () => ((eng = b.dataset.e), drawEngine())));

    const submit = () => {
      const f = from.value.trim(), t = to.value.trim();

    C.autocomplete(to, { onEnter: submit });
    $('#go').onclick = submit;
    $('#swap').onclick = () => ([from.value, to.value] = [to.value, from.value]);
    $('#surprise').onclick = () => {
      const [a, b] = WS.articles.pickPair();
      WS.app.go('six-degrees', { from: a, to: b, engine: eng === 'auto' ? undefined : eng });
    };

    if (!params.from || !params.to) {
      out.innerHTML = `<div class="card prose">
        <h2 style="margin-top:0">How it works</h2>
        <p>Wikipedia is a giant directed graph: articles are nodes, links are edges. To find the shortest route, the search grows two frontiers at once — forward from the start (pages it links to) and backward from the target (pages that link to it) — always expanding whichever side is cheaper. The moment the frontiers touch, every page where they meet gives a shortest path.</p>
        <p><b>Database</b> asks the Six Degrees of Wikipedia server, which runs this search over a full snapshot of the ~6 million article link graph in milliseconds. <b>Live</b> runs the same algorithm right here in your browser against the live Wikipedia API — slower, but it knows about articles and links added since the snapshot.</p>

    }

    const ctrl = new AbortController();
    const t0 = performance.now();
    out.innerHTML = `<div class="card"><div class="row" style="margin-bottom:10px"><span class="spinner"></span><b id="status">Searching…</b><span class="spacer"></span><button class="btn btn-sm" id="cancel">Cancel</button></div><div class="progress"><div></div></div><p class="muted small" id="detail" style="margin:10px 0 0"></p></div>`;
    U.$('#cancel', out).onclick = () => ctrl.abort();
    const status = U.$('#status', out), detail = U.$('#detail', out);
    const onProgress = (p) => {
      if (p.fallback) {
        status.textContent = 'Not in the Six Degrees database — searching live Wikipedia…';
        detail.textContent = p.reason;
        return;
      }
      status.textContent = `Searching live Wikipedia · depth ${p.depth} · ${p.direction}`;
      detail.textContent = `${p.explored.toLocaleString()} pages expanded · ${(p.requests || 0).toLocaleString()} API requests · frontier ${p.frontier.toLocaleString()} pages · ${((performance.now() - t0) / 1000).toFixed(1)}s`;
    };

    let r;
    try {
      r = await WS.sdow.find(params.from, params.to, { engine, signal: ctrl.signal, onProgress });
    } catch (e) {
      if (e.name === 'AbortError') {
        out.innerHTML = `<div class="card muted">Search cancelled.</div>`;

      }
      out.innerHTML = `<div class="card"><b>Search failed.</b> <span class="muted">${esc(e.message)}</span>
        ${engine !== 'live' ? `<div style="margin-top:12px"><a class="btn btn-sm" href="#/six-degrees?from=${encodeURIComponent(params.from)}&to=${encodeURIComponent(params.to)}&engine=live">Try the live engine</a></div>` : ''}</div>`;
      return;
    }
    from.value = r.source;
    to.value = r.target;
    const secs = (r.ms / 1000).toFixed(r.ms < 1000 ? 2 : 1);
    const engineLabel = r.engine === 'sdow' ? 'Six Degrees database' : `live Wikipedia (${(r.requests || 0).toLocaleString()} requests)`;
    if (!r.paths.length) {
      out.innerHTML = `<div class="card"><p class="sd-headline">${r.gaveUp ? 'Gave up' : 'No path'} from <b>${esc(r.source)}</b> to <b>${esc(r.target)}</b>.</p>
        <p class="muted small">${r.gaveUp ? 'The live search hit its request budget before the frontiers met. The database engine can search much deeper.' : 'Some pages simply cannot reach others — e.g. pages with no outgoing links.'} · ${engineLabel} · ${secs}s</p></div>`;
      return;
    }
    const mkPaths = (n) => r.paths.slice(0, n).map((p, i) => C.pathRow(p, i)).join('');
    out.innerHTML = `
      <div class="card">
        <p class="sd-headline">Found <b>${U.plural(r.totalPaths, 'path')}</b> with <b>${U.plural(r.degrees, 'degree')}</b> of separation from <b>${esc(r.source)}</b> to <b>${esc(r.target)}</b>.</p>
        <p class="muted small" style="margin:6px 0 14px">${engineLabel} · ${secs}s${r.approximate ? ' · <span class="pill pill-warn" title="Some very large link lists were truncated">approximate</span>' : ''}${r.fallbackReason ? ` · fell back to live search` : ''}</p>
        <div class="row" style="margin-bottom:14px">
          <a class="btn btn-hot" href="#/play?mode=custom&start=${encodeURIComponent(r.source)}&target=${encodeURIComponent(r.target)}">▶ Race this pair</a>
          <a class="btn" href="#/six-degrees?from=${encodeURIComponent(r.target)}&to=${encodeURIComponent(r.source)}${engine !== 'auto' ? '&engine=' + engine : ''}">⇄ Reverse</a>
          ${r.engine === 'sdow' ? `<a class="btn btn-ghost" href="#/six-degrees?from=${encodeURIComponent(r.source)}&to=${encodeURIComponent(r.target)}&engine=live">Re-run live</a>` : ''}
        </div>
        <div class="graph-wrap" id="graph" style="max-height:560px"></div>
        ${r.paths.length > 40 ? `<p class="muted tiny">Graph shows 40 of ${r.paths.length} paths.</p>` : ''}
      </div>
      <div class="card" style="margin-top:16px"><h2>Paths</h2><div class="paths-list" id="plist">${mkPaths(20)}</div>
      ${r.paths.length > 20 ? `<button class="btn btn-sm" id="more" style="margin-top:10px">Show all ${r.paths.length}</button>` : ''}</div>`;
    WS.graph.render(U.$('#graph', out), r.paths.slice(0, 40));
    const more = U.$('#more', out);
    if (more) more.onclick = () => ((U.$('#plist', out).innerHTML = mkPaths(r.paths.length)), more.remove());
    return () => ctrl.abort();
  };

  // ======================================================================
  // History
  // ======================================================================
  V.history = async (el, params) => {
    const filter = params.filter || 'all';
    el.innerHTML = `<h1 class="serif" style="margin:0 0 14px">Your runs</h1><div id="h"><div class="empty"><span class="spinner"></span></div></div>`;
    await WS.fb.ready;
    const runs = await WS.store.allRuns();
    const st = WS.store.stats(runs);
    const shown = runs.filter((r) => (filter === 'daily' ? r.date : filter === 'finished' ? r.finished : true));
    U.$('#h', el).innerHTML = `
      <div class="stats">
        <div class="stat"><div class="k">Played</div><div class="v">${st.played}</div></div>
        <div class="stat"><div class="k">Finished</div><div class="v">${st.finished}</div></div>
        <div class="stat hot"><div class="k">Best time</div><div class="v">${U.fmtTime(st.bestTime)}</div></div>
        <div class="stat"><div class="k">Avg clicks</div><div class="v">${st.avgClicks != null ? st.avgClicks.toFixed(1) : '–'}</div></div>
        <div class="stat good"><div class="k">Perfect runs</div><div class="v">${st.perfect}</div></div>
        <div class="stat"><div class="k">Efficiency</div><div class="v">${st.efficiency != null ? Math.round(st.efficiency * 100) + '%' : '–'}</div></div>
      </div>
      <div class="row" style="margin-bottom:12px">
        <div class="seg">${['all', 'daily', 'finished'].map((f) => `<button class="${f === filter ? 'on' : ''}" data-f="${f}">${f[0].toUpperCase() + f.slice(1)}</button>`).join('')}</div>
        <span class="spacer"></span>
        <span class="muted small">${WS.fb.user ? '☁️ Synced to your account' : '💾 Saved on this device — <a href="#/account">sign in</a> to sync'}</span>
      </div>
      ${shown.length ? `<div class="grid grid-2">${shown.map(runItem).join('')}</div>` : `<div class="empty"><div class="e">🏃</div>No runs yet.<br><br><a class="btn btn-hot" href="#/play?mode=daily">Play the daily challenge</a></div>`}`;
    U.$$('.seg button', el).forEach((b) => (b.onclick = () => WS.app.go('history', { filter: b.dataset.f === 'all' ? undefined : b.dataset.f })));
  };

  // ======================================================================
  // Leaderboard: #/leaderboard?date=YYYY-MM-DD&by=time|clicks
  // ======================================================================
  V.leaderboard = async (el, params) => {
    const today = U.todayKey();
    const date = /^\d{4}-\d{2}-\d{2}$/.test(params.date || '') ? params.date : today;
    const by = params.by === 'clicks' ? 'clicks' : 'time';
    const [s, t] = WS.articles.dailyPair(date);
    const shift = (n) => {
      const d = new Date(date + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() + n);
      return U.todayKey(d);
    };
    const prev = shift(-1), next = shift(1);
    el.innerHTML = `
      <div class="row" style="margin-bottom:14px">
        <a class="icon-btn" href="#/leaderboard?date=${prev}${by === 'clicks' ? '&by=clicks' : ''}" title="Previous day">◀</a>
        <div><h1 class="serif" style="margin:0;font-size:1.7rem">Daily #${U.dailyNumber(date)} leaderboard</h1>
          <div class="muted small">${new Date(date + 'T12:00:00Z').toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div></div>
        ${next <= today ? `<a class="icon-btn" href="#/leaderboard?date=${next}${by === 'clicks' ? '&by=clicks' : ''}" title="Next day">▶</a>` : ''}
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="row"><b class="serif" style="font-size:1.15rem">${esc(s)} → ${esc(t)}</b><span class="spacer"></span>
          <a class="btn btn-sm ${date === today ? 'btn-hot' : ''}" href="#/play?mode=daily&date=${date}">${date === today ? '▶ Play' : 'Practice'}</a>
          <a class="btn btn-sm" href="#/six-degrees?from=${encodeURIComponent(s)}&to=${encodeURIComponent(t)}">🔭 Shortest paths</a></div>
      </div>
      <div class="row" style="margin-bottom:12px"><div class="seg">
        <button class="${by === 'time' ? 'on' : ''}" data-by="time">⏱ Fastest</button>
        <button class="${by === 'clicks' ? 'on' : ''}" data-by="clicks">🖱 Fewest clicks</button></div></div>
      <div class="card" id="lb" style="padding:8px 12px"><div class="empty"><span class="spinner"></span></div></div>`;
    U.$$('[data-by]', el).forEach((b) => (b.onclick = () => WS.app.go('leaderboard', { date, by: b.dataset.by === 'time' ? undefined : 'clicks' })));
    const lb = U.$('#lb', el);
    const ok = await WS.fb.ready;
    if (!ok) {
      lb.innerHTML = `<div class="empty"><div class="e">🔌</div>Leaderboards need the online version.<br><span class="small">Play at <a href="https://wiki-speedruns.web.app">wiki-speedruns.web.app</a>.</span></div>`;
      return;
    }
    let rows;
    try {
      rows = await WS.fb.leaderboard(date, by, 100);
    } catch (e) {
      lb.innerHTML = `<div class="empty">Couldn't load the leaderboard: ${esc(e.message)}</div>`;
      return;
    }
    if (!rows.length) {
      lb.innerHTML = `<div class="empty"><div class="e">🏁</div>No finishers yet. Be the first!</div>`;
      return;
    }
    const me = WS.fb.user && WS.fb.user.uid;
    const medal = (i) => ['🥇', '🥈', '🥉'][i] || i + 1;
    lb.innerHTML = `<table class="table"><thead><tr><th>#</th><th>Player</th><th class="num">Time</th><th class="num">Clicks</th></tr></thead><tbody>
      ${rows
        .map(
          (r, i) => `<tr class="${r.uid === me ? 'me' : ''}" title="${esc((r.path || []).join(' → '))}">
            <td class="rank">${medal(i)}</td>
            <td><div class="row" style="gap:8px;flex-wrap:nowrap">${C.avatar(r.displayName, r.photoURL)}<span>${esc(r.displayName)}</span>${r.optimal && r.clicks <= r.optimal ? '<span title="Shortest possible path">⭐</span>' : ''}</div></td>
            <td class="num">${U.fmtTime(r.timeMs)}</td><td class="num">${r.clicks}</td></tr>`
        )
        .join('')}</tbody></table>
      ${me ? '' : `<p class="muted small center"><a href="#/account">Sign in</a> to get on the board.</p>`}`;
  };

  // ======================================================================
  // Account + settings
  // ======================================================================
  V.account = async (el) => {
    el.innerHTML = `<div style="max-width:560px;margin:0 auto"><h1 class="serif" style="margin:0 0 14px">Account</h1><div id="acct"><div class="empty"><span class="spinner"></span></div></div>

    drawSettings(U.$('#settings', el));
    const box = U.$('#acct', el);
    const ok = await WS.fb.ready;
    if (!ok) {
      box.innerHTML = `<div class="card"><h2>Login unavailable</h2><p class="muted">This copy of WikiSpeedruns isn't connected to Firebase${location.protocol === 'file:' ? ' (you opened it as a local file)' : ''}. Your runs are still saved on this device.</p><p class="small">For accounts, leaderboards and sync, play at <a href="https://wiki-speedruns.web.app">wiki-speedruns.web.app</a>.</p></div>`;

    }
    const draw = () => {
      const u = WS.fb.user;
      if (!u) return drawSignIn(box);
      const p = WS.fb.profile || {};
      box.innerHTML = `<div class="card">
        <div class="row"><span class="avatar" style="width:56px;height:56px;font-size:1.4rem;${p.photoURL ? `background-image:url('${esc(p.photoURL)}')` : ''}">${p.photoURL ? '' : esc((p.displayName || '?')[0])}</span>
          <div><div class="serif" style="font-size:1.3rem;font-weight:700">${esc(p.displayName || '')}</div>
          <div class="muted small">${u.isAnonymous ? 'Guest account — only on this device until you upgrade' : esc(u.email || '')}</div></div></div>
        <div style="margin-top:16px"><label class="field">Leaderboard name</label>
          <div class="row" style="flex-wrap:nowrap"><input class="input" id="name" maxlength="32" value="${esc(p.displayName || '')}"><button class="btn" id="save-name">Save</button></div></div>
        ${u.isAnonymous ? `<div class="card" style="margin-top:16px;background:var(--accent-soft);border-color:transparent;box-shadow:none"><b>Keep your runs forever</b><p class="small muted" style="margin:4px 0 10px">Upgrade your guest account — your history and leaderboard entries come with you.</p><button class="btn btn-primary" id="upgrade">${googleIcon} Continue with Google</button></div>` : ''}
        <div class="row" style="margin-top:16px"><a class="btn" href="#/history">Your runs</a><span class="spacer"></span><button class="btn btn-ghost" id="out">Sign out</button></div></div>`;
      U.$('#save-name', box).onclick = async () => {
        try {
          await WS.fb.setDisplayName(U.$('#name', box).value);
          U.toast('Name saved', 'good');
        } catch (e) {
          U.toast(e.message, 'bad');
        }
      };
      U.$('#out', box).onclick = () => WS.fb.signOut();
      const up = U.$('#upgrade', box);
      if (up) up.onclick = () => WS.fb.signInGoogle().catch((e) => U.toast(e.message, 'bad'));
    };
    draw();
    const off = WS.fb.onChange(draw);
    return off;
  };

  const googleIcon = `<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>`;

  function drawSignIn(box, { inModal = false } = {}) {
    box.innerHTML = `<div class="${inModal ? '' : 'card'}">
      <h2>Sign in</h2>
      <p class="muted small" style="margin-top:0">Get on the daily leaderboard and sync your runs across devices.</p>
      <button class="btn btn-block" id="g">${googleIcon} Continue with Google</button>
      <div class="divider">or with email</div>
      <form id="ef">
        <input class="input" type="email" id="em" placeholder="Email" autocomplete="email" required style="margin-bottom:8px">
        <input class="input" type="password" id="pw" placeholder="Password (6+ characters)" autocomplete="current-password" required minlength="6" style="margin-bottom:10px">
        <div class="row"><button class="btn btn-primary" type="submit" id="signin">Sign in</button><button class="btn" type="button" id="signup">Create account</button><span class="spacer"></span><button class="btn btn-ghost btn-sm" type="button" id="forgot">Forgot?</button></div>
      </form>
      <div class="divider">or</div>
      <button class="btn btn-block btn-ghost" id="guest">👤 Play as guest</button>
      <p class="muted tiny" style="margin-bottom:0">Guests get a leaderboard name and can upgrade to a full account later.</p></div>`;
    const $ = (s) => U.$(s, box);
    const busy = async (btn, fn) => {
      const html = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      try {
        await fn();
        return true;
      } catch (e) {
        U.toast(e.message, 'bad', 5000);
        return false;
      } finally {
        btn.disabled = false;
        btn.innerHTML = html;
      }
    };
    const done = () => box.dispatchEvent(new CustomEvent('signedin', { bubbles: true }));
    $('#g').onclick = async () => (await busy($('#g'), WS.fb.signInGoogle)) && done();
    $('#guest').onclick = async () => (await busy($('#guest'), WS.fb.signInGuest)) && done();
    $('#ef').onsubmit = async (e) => {
      e.preventDefault();
      (await busy($('#signin'), () => WS.fb.signInEmail($('#em').value, $('#pw').value, false))) && done();
    };
    $('#signup').onclick = async () => {
      if (!$('#ef').reportValidity()) return;
      (await busy($('#signup'), () => WS.fb.signInEmail($('#em').value, $('#pw').value, true))) && done();
    };
    $('#forgot').onclick = async () => {
      const em = $('#em').value.trim();
      if (!em) return U.toast('Enter your email first.');
      (await busy($('#forgot'), () => WS.fb.resetPassword(em))) && U.toast('Password reset email sent.', 'good');

  WS.ui.signInModal = () => {
    const m = U.modal('<div id="si"></div>');
    const box = U.$('#si', m.el);
    drawSignIn(box, { inModal: true });
    box.addEventListener('signedin', () => {
      m.close();
      U.toast('Signed in!', 'good');
    });
  };

  function drawSettings(box) {
    const s = WS.store.settings();
    box.innerHTML = `<h2>Settings</h2>
      <div class="row" style="justify-content:space-between;margin-bottom:12px"><span>Theme</span>
        <div class="seg">${['auto', 'light', 'dark'].map((t) => `<button data-theme="${t}" class="${s.theme === t ? 'on' : ''}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div></div>
      <label class="row" style="justify-content:space-between;margin-bottom:12px"><span>Show par before starting<br><span class="muted tiny">The optimal number of clicks, from Six Degrees</span></span><input type="checkbox" id="par" ${s.showPar ? 'checked' : ''}></label>
      <label class="row" style="justify-content:space-between;margin-bottom:12px"><span>Hide citation numbers<br><span class="muted tiny">Cleaner articles, fewer misclicks</span></span><input type="checkbox" id="refs" ${s.hideRefs ? 'checked' : ''}></label>
      <label class="row" style="justify-content:space-between;margin-bottom:12px"><span>Allow the Back button during runs<br><span class="muted tiny">Off matches the classic no-takebacks rule. Turning this on also takes a run out of ranked leaderboard contention.</span></span><input type="checkbox" id="allow-back" ${s.allowBack ? 'checked' : ''}></label>
      <label class="row" style="justify-content:space-between"><span>Allow searching articles (Ctrl+F / Cmd+F)<br><span class="muted tiny">Off by default — no searching for the target. Turning this on also takes a run out of ranked leaderboard contention.</span></span><input type="checkbox" id="allow-find" ${s.allowFind ? 'checked' : ''}></label>`;
    U.$$('[data-theme]', box).forEach((b) => (b.onclick = () => {
      WS.store.setSetting('theme', b.dataset.theme);
      WS.app.applyTheme();
      drawSettings(box);
    }));
    U.$('#par', box).onchange = (e) => WS.store.setSetting('showPar', e.target.checked);
    U.$('#refs', box).onchange = (e) => WS.store.setSetting('hideRefs', e.target.checked);
    U.$('#allow-back', box).onchange = (e) => WS.store.setSetting('allowBack', e.target.checked);
    U.$('#allow-find', box).onchange = (e) => WS.store.setSetting('allowFind', e.target.checked);
  }

  // ======================================================================
  // About
  // ======================================================================
  V.about = async (el) => {
    const isFile = location.protocol === 'file:';
    el.innerHTML = `<div class="prose">
      <h1 class="serif">About WikiSpeedruns</h1>
      <h2>How to play</h2>
      <ol>
        <li>You get a <b>start</b> article and a <b>target</b> article.</li>
        <li>Click links inside the article to move between pages. No search bar, no URL hacking.</li>
        <li>Reach the target in as little time — and as few clicks — as you can.</li>
        <li>By default it's <b>no takebacks and no searching</b> — the classic Six Degrees rule. Once you click a link, that's your route, and Ctrl+F/Cmd+F is blocked. The timer pauses while pages load.</li>
        <li>You can turn on the <b>Back</b> button and/or in-article <b>searching</b> for yourself in <a href="#/account">Settings</a> — but a run using either won't count for the ranked daily leaderboard, same as using a hint.</li>
      </ol>
      <p>The <b>Daily Challenge</b> is the same pair for everyone and resets at 00:00 UTC. Your first attempt counts for the leaderboard; after that it's practice. Hints, Back, and searching are all disabled on ranked runs by default — turning any of them on for a run takes it out of ranked contention.</p>
      <p>Shortcuts (when Back is enabled in Settings): <kbd>Alt</kbd>+<kbd>←</kbd> or <kbd>Backspace</kbd> to go back.</p>

      <h2>Six Degrees of Wikipedia inside</h2>
      <p>After every run, WikiSpeedruns compares your route with <b>every shortest path</b> between the two articles, using <a href="https://github.com/jwngr/sdow" target="_blank" rel="noopener">Six Degrees of Wikipedia</a> by Jacob Wenger (MIT license). For each page you visited it asks how many clicks you still were from the target, so you can see exactly where you gained or lost ground — and what the best link was.</p>
      <p>The <a href="#/six-degrees">explorer</a> can use the Six Degrees database, or run a port of its bi-directional breadth-first search right in your browser against live Wikipedia.</p>

      <h2>Install it</h2>
      <ul>
        <li><b>Phone:</b> open <a href="https://wiki-speedruns.web.app">wiki-speedruns.web.app</a>, then <i>Share → Add to Home Screen</i> (iOS) or <i>⋮ → Install app</i> (Android). It runs full-screen like a native app.</li>
        <li><b>Desktop:</b> click the install icon in Chrome/Edge's address bar.</li>
        <li><b>Single HTML file:</b> ${isFile ? 'you are using it right now!' : '<a href="WikiSpeedruns.html" download>download WikiSpeedruns.html</a> and open it in any browser — no server needed. (Accounts and leaderboards need the online version.)'}</li>
      </ul>
      <h2>Credits</h2>
      <p>Article content from <a href="https://en.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a>, available under <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>. Shortest paths from <a href="https://www.sixdegreesofwikipedia.com" target="_blank" rel="noopener">Six Degrees of Wikipedia</a>. Inspired by <a href="https://wikispeedruns.com" target="_blank" rel="noopener">wikispeedruns.com</a>. Not affiliated with the Wikimedia Foundation.</p>
    </div>`;
  };
})(window);

</script>
  <script>
/* App shell: hash router, top/bottom nav, account button, theme, service worker. */
(function (root) {
  const WS = (root.WS = root.WS || {});
  const U = WS.util;
  const esc = U.esc;

  const ROUTES = {
    '': { view: 'home', nav: 'home', title: 'WikiSpeedruns' },
    play: { view: 'play', nav: 'play', title: 'Play' },
    run: { view: 'run', nav: 'history', title: 'Results' },
    'six-degrees': { view: 'sixDegrees', nav: 'six', title: 'Six Degrees of Wikipedia' },
    history: { view: 'history', nav: 'history', title: 'Your runs' },
    leaderboard: { view: 'leaderboard', nav: 'lb', title: 'Leaderboard' },
    account: { view: 'account', nav: 'me', title: 'Account' },
    about: { view: 'about', nav: 'about', title: 'About' },
  };

  const app = (WS.app = { guard: null });
  let cleanups = [];
  let token = 0;
  let lastHash = location.hash;

  const parse = () => {
    const h = location.hash.replace(/^#\/?/, '');
    const [path, qs] = h.split('?');
    const params = {};
    new URLSearchParams(qs || '').forEach((v, k) => (params[k] = v));
    return { path: path.replace(/\/$/, ''), params };
  };
  const build = (route, params = {}) => {
    const qs = new URLSearchParams();
    for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== null && v !== '') qs.set(k, v);
    const s = qs.toString();
    return `#/${route}${s ? '?' + s : ''}`;
  };

  app.go = (route, params) => {
    const h = build(route, params);
    if (h === location.hash) render();
    else location.hash = h;
  };
  app.replaceRoute = (route, params) => {
    history.replaceState(null, '', build(route, params));
    lastHash = location.hash;
    render();
  };
  /** Register teardown for the current view (timers, listeners, in-flight requests). */
  app.addCleanup = (fn) => cleanups.push(fn);

  async function render() {
    const my = ++token;
    cleanups.splice(0).forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
    const { path, params } = parse();
    const route = ROUTES[path] || ROUTES[''];
    document.title = route.title === 'WikiSpeedruns' ? 'WikiSpeedruns — race through Wikipedia' : `${route.title} · WikiSpeedruns`;
    U.$$('[data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === route.nav));
    document.body.classList.remove('in-game');
    const el = document.getElementById('view');
    el.innerHTML = '';
    window.scrollTo(0, 0);
    try {
      const cleanup = await WS.views[route.view](el, params);
      if (typeof cleanup === 'function') {
        if (my === token) cleanups.push(cleanup);
        else cleanup();
      }
    } catch (e) {
      console.error(e);
      if (my === token) el.innerHTML = `<div class="empty"><div class="e">💥</div>Something broke: ${esc(e.message)}<br><br><a class="btn" href="#/">Home</a></div>`;
    }
  }

  window.addEventListener('hashchange', () => {
    if (app.guard && !app.guard()) {
      history.replaceState(null, '', lastHash);
      return;
    }
    lastHash = location.hash;
    render();
  });

  // ---------- Theme ----------
  app.applyTheme = () => {
    const t = WS.store.settings().theme;
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    const dark = t === 'dark' || (t === 'auto' && root.matchMedia && root.matchMedia('(prefers-color-scheme: dark)').matches);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#171a21' : '#ffffff');
    const btn = document.getElementById('theme-btn');
    if (btn) btn.textContent = dark ? '☀️' : '🌙';
  };

  // ---------- Account button ----------
  function drawAccount() {
    const btn = document.getElementById('acct-btn');
    if (!btn) return;
    const u = WS.fb.user;
    if (!WS.fb.enabled) {
      btn.className = 'acct-btn signed-out';
      btn.innerHTML = 'Sign in';
    } else if (!u) {
      btn.className = 'acct-btn signed-out';
      btn.innerHTML = 'Sign in';
    } else {
      const p = WS.fb.profile || {};
      btn.className = 'acct-btn';
      btn.innerHTML = `${WS.ui.avatar(p.displayName, p.photoURL)}<span class="hide-sm" style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.displayName || 'Me')}</span>`;
    }
  }

  function boot() {
    app.applyTheme();
    if (root.matchMedia) root.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', app.applyTheme);
    document.getElementById('theme-btn').onclick = () => {
      const dark = document.getElementById('theme-btn').textContent === '☀️';
      WS.store.setSetting('theme', dark ? 'light' : 'dark');
      app.applyTheme();
    };
    const acct = document.getElementById('acct-btn');
    acct.onclick = async () => {
      const ok = await WS.fb.ready;
      if (ok && !WS.fb.user) WS.ui.signInModal();
      else app.go('account');
    };
    drawAccount();
    WS.fb.onChange(drawAccount);
    WS.fb.ready.then(drawAccount);
    document.body.classList.add('has-bottom-nav');
    lastHash = location.hash;
    render();

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW', e));
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
</body>
</html>
