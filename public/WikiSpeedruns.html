/* ============ Tokens ============ */
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #eef0f5;
  --surface-3: #e3e7ef;
  --text: #16181d;
  --muted: #5d6573;
  --border: #d9dde5;
  --accent: #3a63f0;
  --accent-ink: #ffffff;
  --accent-soft: #e5ebff;
  --hot: #ff6a1a;
  --hot-soft: #fff0e6;
  --good: #16955a;
  --good-soft: #e3f6ec;
  --warn: #c98a00;
  --warn-soft: #fff5d9;
  --bad: #d23f3f;
  --bad-soft: #fde8e8;
  --link: #3366cc;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 4px 16px rgba(16, 24, 40, 0.06);
  --shadow-lg: 0 12px 40px rgba(16, 24, 40, 0.18);
  --radius: 14px;
  --serif: 'Linux Libertine', 'Georgia', 'Times New Roman', serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1e222b;
    --surface-3: #272c37;
    --text: #e8eaef;
    --muted: #9aa3b2;
    --border: #2d3340;
    --accent: #6d8dff;
    --accent-ink: #0b0d12;
    --accent-soft: #1d2542;
    --hot: #ff8a45;
    --hot-soft: #3a2415;
    --good: #3ecf8e;
    --good-soft: #13301f;
    --warn: #f0b429;
    --warn-soft: #3a2f10;
    --bad: #ff6b6b;
    --bad-soft: #3a1717;
    --link: #8fb0ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0f1115;
  --surface: #171a21;
  --surface-2: #1e222b;
  --surface-3: #272c37;
  --text: #e8eaef;
  --muted: #9aa3b2;
  --border: #2d3340;
  --accent: #6d8dff;
  --accent-ink: #0b0d12;
  --accent-soft: #1d2542;
  --hot: #ff8a45;
  --hot-soft: #3a2415;
  --good: #3ecf8e;
  --good-soft: #13301f;
  --warn: #f0b429;
  --warn-soft: #3a2f10;
  --bad: #ff6b6b;
  --bad-soft: #3a1717;
  --link: #8fb0ff;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

/* ============ Base ============ */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
}
a { color: var(--link); }
button, input, select { font: inherit; color: inherit; }
img { max-width: 100%; }
h1, h2, h3 { line-height: 1.2; }
.serif { font-family: var(--serif); }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.tiny { font-size: 0.78rem; }
.hidden { display: none !important; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.center { text-align: center; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ============ Top bar ============ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px max(16px, env(safe-area-inset-left));
  padding-top: max(10px, env(safe-area-inset-top));
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--border);
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--serif);
  font-size: 1.25rem;
  font-weight: 700;
  text-decoration: none;
  color: var(--text);
  white-space: nowrap;
}
.brand img { width: 30px; height: 30px; }
.brand b { color: var(--hot); font-weight: 700; }
.nav { display: flex; gap: 2px; margin-left: 12px; }
.nav a {
  padding: 7px 12px;
  border-radius: 999px;
  text-decoration: none;
  color: var(--muted);
  font-weight: 600;
  font-size: 0.93rem;
}
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.active { background: var(--accent-soft); color: var(--accent); }
.bottom-nav { display: none; }
@media (max-width: 760px) {
  .nav { display: none; }
  .bottom-nav {
    display: flex;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 50;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bottom-nav a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 0 6px;
    font-size: 0.7rem;
    font-weight: 600;
    text-decoration: none;
    color: var(--muted);
  }
  .bottom-nav a span { font-size: 1.25rem; line-height: 1; }
  .bottom-nav a.active { color: var(--accent); }
  body.has-bottom-nav main { padding-bottom: 84px; }
  body.in-game .bottom-nav { display: none; }
}

/* ============ Buttons & inputs ============ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.06s ease, background 0.15s ease, border-color 0.15s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
.btn-hot { background: var(--hot); border-color: var(--hot); color: #fff; }
.btn-hot:hover { background: color-mix(in srgb, var(--hot) 88%, black); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-lg { padding: 14px 22px; font-size: 1.08rem; border-radius: 12px; }
.btn-sm { padding: 6px 10px; font-size: 0.85rem; border-radius: 8px; }
.btn-block { width: 100%; }
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  color: var(--text);
  font-size: 1.05rem;
}
.icon-btn:hover { background: var(--surface-2); }
.input {
  width: 100%;
  padding: 11px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
label.field { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.seg {
  display: inline-flex;
  background: var(--surface-2);
  border-radius: 10px;
  padding: 3px;
  gap: 2px;
}
.seg button {
  border: 0;
  background: transparent;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.88rem;
  color: var(--muted);
}
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

/* ============ Layout ============ */
main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
}
.card h2 { margin: 0 0 12px; font-size: 1.15rem; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.section-title { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0 0 10px; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 700;
  background: var(--surface-2);
  color: var(--muted);
}
.pill-hot { background: var(--hot-soft); color: var(--hot); }
.pill-good { background: var(--good-soft); color: var(--good); }
.pill-accent { background: var(--accent-soft); color: var(--accent); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-bad { background: var(--bad-soft); color: var(--bad); }

/* ============ Home ============ */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  padding: 36px 28px;
  background:
    radial-gradient(1200px 400px at 110% -10%, color-mix(in srgb, var(--hot) 28%, transparent), transparent 60%),
    radial-gradient(900px 400px at -10% 120%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 60%),
    var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.hero h1 { font-family: var(--serif); font-size: clamp(2rem, 5vw, 3.2rem); margin: 0 0 8px; letter-spacing: -0.01em; }
.hero p { margin: 0 0 20px; color: var(--muted); font-size: 1.08rem; max-width: 620px; }
.daily {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: stretch;
  margin: 18px 0 20px;
}
@media (max-width: 640px) {
  .daily { grid-template-columns: 1fr; }
  .daily .arrow { transform: rotate(90deg); justify-self: center; }
}
.daily .arrow { align-self: center; font-size: 1.6rem; color: var(--hot); font-weight: 800; }

.page-card {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  min-width: 0;
  text-decoration: none;
  color: inherit;
}
.page-card .thumb {
  flex: 0 0 auto;
  width: 56px;
  height: 56px;
  border-radius: 10px;
  background: var(--surface-3) center/cover no-repeat;
  display: grid;
  place-items: center;
  font-family: var(--serif);
  font-size: 1.5rem;
  color: var(--muted);
}
.page-card .meta { min-width: 0; }
.page-card .title { font-family: var(--serif); font-weight: 700; font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; }
.page-card .desc { color: var(--muted); font-size: 0.85rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.page-card .label { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.page-card.big { padding: 16px; }
.page-card.big .thumb { width: 84px; height: 84px; }
.page-card.big .title { font-size: 1.35rem; }
.page-card.target { border-color: color-mix(in srgb, var(--hot) 50%, var(--border)); background: var(--hot-soft); }

.mode-card { display: flex; flex-direction: column; gap: 10px; }
.mode-card .emoji { font-size: 1.8rem; }
.mode-card h3 { margin: 0; font-size: 1.1rem; }
.mode-card p { margin: 0; color: var(--muted); font-size: 0.92rem; flex: 1; }

@media (max-width: 640px) {
  .hero { padding: 22px 16px; border-radius: 18px; }
  .hero h1 { font-size: 1.85rem; }
  .hero p { font-size: 0.98rem; margin-bottom: 14px; }
  .daily { gap: 2px; margin: 14px 0 16px; }
  .daily .arrow { font-size: 1.15rem; line-height: 1; }
  .daily .page-card { padding: 10px; }
  .daily .page-card .thumb { width: 48px; height: 48px; }
  .daily .page-card .desc { display: none; }
  #daily-actions .btn-lg { flex: 1 1 100%; }
  .section-title { margin-top: 22px !important; }
  .mode-card {
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-areas: "emoji title btn" "emoji text btn";
    align-items: center;
    column-gap: 12px;
    row-gap: 2px;
    padding: 12px 14px;
  }
  .mode-card .emoji { grid-area: emoji; font-size: 1.6rem; }
  .mode-card h3 { grid-area: title; font-size: 1rem; }
  .mode-card p { grid-area: text; font-size: 0.8rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mode-card .btn { grid-area: btn; padding: 8px 12px; font-size: 0.85rem; }
  .grid-3 { gap: 10px; }
}

/* ============ Autocomplete ============ */
.ac { position: relative; }
.ac-list {
  position: absolute;
  z-index: 30;
  left: 0;
  right: 0;
  top: calc(100% + 4px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  max-height: 360px;
  overflow-y: auto;
}
.ac-item { display: flex; gap: 10px; align-items: center; padding: 8px 10px; cursor: pointer; }
.ac-item.on, .ac-item:hover { background: var(--accent-soft); }
.ac-item .thumb { width: 36px; height: 36px; border-radius: 8px; background: var(--surface-3) center/cover; flex: 0 0 auto; display: grid; place-items: center; color: var(--muted); }
.ac-item .t { font-weight: 600; }
.ac-item .d { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac-item > div { min-width: 0; }

/* ============ Game HUD ============ */
body.in-game .topbar { display: none; }
body.in-game main { max-width: none; padding: 0; }
.hud {
  position: fixed;
  left: 50%;
  bottom: max(12px, calc(6px + env(safe-area-inset-bottom)));
  transform: translateX(-50%);
  z-index: 40;
  width: calc(100% - 16px);
  max-width: 900px;
  overflow: hidden;
  border-radius: 22px;
  background: color-mix(in srgb, var(--surface) 93%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
  box-shadow: var(--shadow-lg);
  animation: hud-float 7s ease-in-out infinite;
}
@keyframes hud-float {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-3px); }
}
@media (prefers-reduced-motion: reduce) {
  .hud { animation: none; }
}
.hud-main {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px 8px;
  margin: 0 auto;
}
.hud-target {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px 5px 5px;
  border-radius: 10px;
  background: var(--hot-soft);
  border: 1px solid color-mix(in srgb, var(--hot) 35%, transparent);
  cursor: pointer;
  text-align: left;
}
.hud-target .thumb { width: 32px; height: 32px; border-radius: 7px; background: var(--surface-3) center/cover; flex: 0 0 auto; display: grid; place-items: center; color: var(--muted); }
.hud-target .lbl { font-size: 0.65rem; font-weight: 800; letter-spacing: 0.08em; color: var(--hot); text-transform: uppercase; line-height: 1; }
.hud-target .t { font-family: var(--serif); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
.hud-target > div { min-width: 0; }
.hud-stat { text-align: center; min-width: 58px; }
.hud-stat .v { font-family: var(--mono); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.hud-stat .k { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.hud-crumbs {
  display: flex;
  gap: 4px;
  align-items: center;
  overflow-x: auto;
  padding: 0 12px 10px;
  margin: 0 auto;
  scrollbar-width: none;
  font-size: 0.8rem;
}
.hud-crumbs::-webkit-scrollbar { display: none; }
.crumb { white-space: nowrap; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.crumb.cur { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.crumb.back { text-decoration: line-through; opacity: 0.6; }
.crumb-sep { color: var(--muted); opacity: 0.6; }
.loadbar { position: absolute; left: 0; top: 0; height: 3px; width: 0; background: linear-gradient(90deg, var(--accent), var(--hot)); transition: width 0.25s ease; }
.loadbar.on { width: 70%; transition: width 3s cubic-bezier(0.1, 0.7, 0.2, 1); }
.loadbar.done { width: 100%; opacity: 0; transition: width 0.15s, opacity 0.4s 0.15s; }
@media (max-width: 560px) {
  .hud-main { gap: 4px; padding: 6px 8px; }
  .hud-stat { min-width: 44px; }
  .hud-stat .v { font-size: 1rem; }
  .hide-sm { display: none; }
}

.article-wrap { max-width: 980px; margin: 0 auto; padding: 18px 18px calc(190px + env(safe-area-inset-bottom)); overflow-x: hidden; overflow-x: clip; }
.article-title { font-family: var(--serif); font-weight: 400; font-size: clamp(1.7rem, 4vw, 2.3rem); margin: 6px 0 4px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.redirect-note { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }

.hint-box {
  position: fixed;
  z-index: 45;
  right: 16px;
  bottom: calc(132px + env(safe-area-inset-bottom));
  max-width: 340px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 0.92rem;
}

/* ============ Results ============ */
.win-banner { text-align: center; padding: 28px 16px 8px; }
.win-banner .big { font-size: 3rem; line-height: 1; }
.win-banner h1 { font-family: var(--serif); margin: 10px 0 4px; font-size: clamp(1.8rem, 5vw, 2.6rem); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 18px 0; }

  top: 0;
  width: 32px;
  height: 32px;

  place-items: center;

.route .dot.further { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }

  gap: 6px;

  border: 1px solid var(--border);

  color: var(--text);
  font-size: 0.88rem;
  font-weight: 600;

(function (root) {
  const WS = (root.WS = root.WS || {});
  const U = (WS.util = {});

  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  U.esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC[c]);

  U.$$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
  U.sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  /** "Albert_einstein" -> "Albert einstein" -> "Albert einstein" (first letter upper, like MediaWiki). */
  U.normTitle = (t) => {
    t = String(t ?? '').replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
    return t ? t[0].toUpperCase() + t.slice(1) : t;
  };
  U.wikiUrl = (title) => 'https://en.wikipedia.org/wiki/' + encodeURIComponent(String(title).replace(/ /g, '_'));

    if (ms == null || !isFinite(ms)) return '–';
    const total = Math.max(0, ms) / 1000;
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = Math.floor(total % 60);
    const t = Math.floor((total * 10) % 10);
    const ss = String(s).padStart(2, '0');
    if (h) return `${h}:${String(m).padStart(2, '0')}:${ss}`;
    return tenths ? `${m}:${ss}.${t}` : `${m}:${ss}`;
  };

  U.plural = (n, word, pl) => `${n} ${n === 1 ? word : pl || word + 's'}`;

  U.relTime = (ts) => {
    const d = (Date.now() - ts) / 1000;
    if (d < 60) return 'just now';
    if (d < 3600) return `${Math.floor(d / 60)}m ago`;
    if (d < 86400) return `${Math.floor(d / 3600)}h ago`;
    if (d < 86400 * 7) return `${Math.floor(d / 86400)}d ago`;
    return new Date(ts).toLocaleDateString();

  U.hash = (str, seed = 0) => {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);

  };

    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);

  U.dailyNumber = (key) => Math.round((Date.parse(key) - Date.parse(U.DAILY_EPOCH)) / 86400000) + 1;

        if (signal && signal.aborted) throw signal.reason || new DOMException('Aborted', 'AbortError');

    get(key, fallback) {
      try {
        const v = localStorage.getItem('ws.' + key);
        return v == null ? fallback : JSON.parse(v);
      } catch (e) {

    set(key, value) {

    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e2) { /* ignore */ }
      ta.remove();
      return ok;
    }

    const rootEl = document.getElementById('toast-root');
    if (!rootEl) return;
    const el = document.createElement('div');
    el.className = `toast toast-${kind}`;
    el.textContent = msg;
    rootEl.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 300);
    }, ms);
  };

  /** Minimal modal. Returns {el, close}. `onClose` fires once. */
  U.modal = (html, { onClose, wide } = {}) => {
    const rootEl = document.getElementById('modal-root');
    const wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.innerHTML = `<div class="modal ${wide ? 'modal-wide' : ''}" role="dialog" aria-modal="true">
      <button class="modal-x icon-btn" aria-label="Close">✕</button>${html}</div>`;
    rootEl.appendChild(wrap);
    let closed = false;
    const close = () => {
      if (closed) return;
      closed = true;
      wrap.classList.remove('show');
      document.removeEventListener('keydown', onKey);
      setTimeout(() => wrap.remove(), 200);
      onClose && onClose();
    };
    const onKey = (e) => e.key === 'Escape' && close();
    document.addEventListener('keydown', onKey);
    wrap.addEventListener('mousedown', (e) => e.target === wrap && close());
    wrap.querySelector('.modal-x').addEventListener('click', close);
    requestAnimationFrame(() => wrap.classList.add('show'));
    return { el: wrap.querySelector('.modal'), close };

    (root.matchMedia && root.matchMedia('(display-mode: standalone)').matches) || root.navigator?.standalone === true;

(function (root) {

  const HEADERS = { 'Api-User-Agent': 'WikiSpeedruns/1.0 (https://wiki-speedruns.web.app)' };

  W.api = async (params, { signal, retries = 4 } = {}) => {

        await U.sleep(500 * 2 ** attempt);

        if (attempt >= retries) throw new Error(`Wikipedia is busy (HTTP ${res.status}). Try again in a moment.`);

        await U.sleep(ra ? ra * 1000 : 800 * 2 ** attempt);
        continue;
      }
      const data = await res.json();
      if (data.error) {
        if (data.error.code === 'maxlag' && attempt < retries) {
          await U.sleep(1000 * 2 ** attempt);
          continue;

        err.code = data.error.code;

      n++;

      for (const t of chunk) {
        let k = U.normTitle(t);
        for (let hops = 0; alias.has(k) && hops < 3; hops++) k = alias.get(k);
        const p = byTitle.get(k);

  W.incomingLinks = async (titles, { signal, maxRequests = 10 } = {}) => {

/* Built-in Six Degrees of Wikipedia.
 *
 * Two engines, same result shape:
 *   - "sdow": the Six Degrees of Wikipedia API (github.com/jwngr/sdow), which runs a
 *     bi-directional BFS over a full snapshot of the Wikipedia link graph. Fast, exhaustive.
 *   - "live": a port of SDOW's breadth_first_search.py that runs in your browser against the
 *     live Wikipedia API. Slower, but works for brand-new articles and when the API is down.
 *
 * Result: { engine, source, target, degrees, paths: [[{title, description, thumb}]],
 *           totalPaths, approximate, ms }
 */
(function (root) {
  const WS = (root.WS = root.WS || {});
  const U = WS.util;
  const SDOW_API = 'https://api.sixdegreesofwikipedia.com/paths';

  const S = (WS.sdow = {});

  // ---------------------------------------------------------------------------
  // Core algorithm (pure; unit-tested in tests/bfs.test.js)
  // ---------------------------------------------------------------------------

  /** Walks parent pointers back to the root (whose parent list is [null]). Port of SDOW get_paths. */
  function getPaths(parents, visited, limit) {
    const out = [];
    for (const id of parents) {
      if (id === null) return [[]];
      for (const p of getPaths(visited.get(id), visited, limit)) {
        out.push(p.concat([id]));
        if (out.length >= limit) return out;
      }
    }
    return out;
  }

  /**
   * Bi-directional BFS, faithful to SDOW's algorithm: expand whichever side is cheaper, stop at
   * the first depth where the frontiers meet, return every shortest path found at that depth.
   *
   * io.outgoing(node)        -> Promise<{links: node[], complete}>   (one node)
   * io.incoming(nodes[])     -> Promise<{links: Map<node, node[]>, complete}> (a batch)
   *
   * Differences from SDOW (because live Wikipedia has no precomputed link counts):
   *   - cost of a side is estimated as frontierSize × running average degree;
   *   - a level can stop early once `maxPaths` shortest paths are found (they're all still shortest);
   *   - `budget()` lets the caller abort when too many requests have been spent.
   */
  S.bidirectionalSearch = async (source, target, io, opts = {}) => {
    const {
      maxPaths = 200,
      concurrency = 4,
      incomingBatch = 50,
      signal,
      onProgress = () => {},
      overBudget = () => false,
      maxDepth = 8,
      probeLimit = 40,
    } = opts;

    if (source === target) return { paths: [[source]], degrees: 0, approximate: false, explored: 0 };

    let fwd = new Map([[source, [null]]]);
    let bwd = new Map([[target, [null]]]);
    const fwdVisited = new Map();
    const bwdVisited = new Map();
    let fDepth = 0;
    let bDepth = 0;
    let avgOut = 300;
    let avgIn = 900;
    let approximate = false;
    let explored = 0;
    const meet = new Set();

    const aborted = () => signal && signal.aborted;

    while (!meet.size && fwd.size && bwd.size) {
      if (aborted()) throw signal.reason || new DOMException('Aborted', 'AbortError');
      if (fDepth + bDepth >= maxDepth || overBudget()) return { paths: [], degrees: null, approximate: true, explored, gaveUp: true };

      // Probe (live engine only): if the frontiers are small, ask directly which forward pages link
      // into the backward frontier. Any hit is an edge between the frontiers, so it completes a
      // shortest path of length fDepth + bDepth + 1 — far cheaper than a full expansion.
      if (io.probe && Math.ceil(fwd.size / 50) * Math.ceil(bwd.size / 50) <= probeLimit) {
        onProgress({ direction: 'probe', depth: fDepth + bDepth + 1, frontier: fwd.size, explored });
        const hits = await io.probe([...fwd.keys()], [...bwd.keys()]);
        if (hits.size) {
          fDepth++;
          for (const [k, v] of fwd) fwdVisited.set(k, v);
          const next = new Map();
          for (const [f, bs] of hits) {
            for (const b of bs) {
              if (!bwd.has(b) || fwdVisited.has(b)) continue;
              if (!next.has(b)) next.set(b, []);
              next.get(b).push(f);
              meet.add(b);
            }
          }
          fwd = next;
          if (meet.size) break;
        }
      }

      const fCost = fwd.size * avgOut;
      const bCost = bwd.size * avgIn;
      const forward = fCost <= bCost;
      const next = new Map();
      let degreeSum = 0;
      let degreeN = 0;

      // Enough meeting nodes to build maxPaths paths? (each meet node gives >= 1 path)
      const enough = () => meet.size >= maxPaths || overBudget();

      if (forward) {
        fDepth++;
        for (const [k, v] of fwd) fwdVisited.set(k, v);
        const nodes = [...fwd.keys()];
        onProgress({ direction: 'forward', depth: fDepth + bDepth, frontier: nodes.length, explored });
        await U.pool(
          nodes,
          concurrency,
          async (node) => {
            const r = await io.outgoing(node);
            explored++;
            if (!r.complete) approximate = true;
            degreeSum += r.links.length;
            degreeN++;
            for (const child of r.links) {
              if (fwdVisited.has(child)) continue;
              const parents = next.get(child);
              if (parents) parents.push(node);
              else next.set(child, [node]);
              if (bwd.has(child)) meet.add(child);
            }
            if (explored % 10 === 0) onProgress({ direction: 'forward', depth: fDepth + bDepth, frontier: nodes.length, explored });
          },
          { signal, shouldStop: enough }
        );
        if (degreeN) avgOut = Math.max(1, degreeSum / degreeN);
        fwd = next;
      } else {
        bDepth++;
        for (const [k, v] of bwd) bwdVisited.set(k, v);
        const nodes = [...bwd.keys()];
        const batches = [];
        for (let i = 0; i < nodes.length; i += incomingBatch) batches.push(nodes.slice(i, i + incomingBatch));
        onProgress({ direction: 'backward', depth: fDepth + bDepth, frontier: nodes.length, explored });
        await U.pool(
          batches,
          concurrency,
          async (batch) => {
            const r = await io.incoming(batch);
            explored += batch.length;
            if (!r.complete) approximate = true;
            for (const node of batch) {
              const parentsOf = r.links.get(node) || [];
              degreeSum += parentsOf.length;
              degreeN++;
              for (const child of parentsOf) {
                if (bwdVisited.has(child)) continue;
                const parents = next.get(child);
                if (parents) parents.push(node);
                else next.set(child, [node]);
                if (fwd.has(child)) meet.add(child);
              }
            }
            onProgress({ direction: 'backward', depth: fDepth + bDepth, frontier: nodes.length, explored });
          },
          { signal, shouldStop: enough }
        );
        if (degreeN) avgIn = Math.max(1, degreeSum / degreeN);
        bwd = next;
      }
    }

    const paths = [];
    const seen = new Set();
    for (const m of meet) {
      const fromSource = getPaths(fwd.get(m), fwdVisited, maxPaths);
      const fromTarget = getPaths(bwd.get(m), bwdVisited, maxPaths);
      for (const a of fromSource) {
        for (const b of fromTarget) {
          const p = a.concat([m], b.slice().reverse());
          const key = p.join('\u0001');
          if (!seen.has(key)) {
            seen.add(key);
            paths.push(p);
          }
          if (paths.length >= maxPaths) break;
        }
        if (paths.length >= maxPaths) break;
      }
      if (paths.length >= maxPaths) break;
    }
    paths.sort((a, b) => a.join('|').localeCompare(b.join('|')));
    return {
      paths,
      degrees: paths.length ? paths[0].length - 1 : null,
      approximate,
      explored,
      noPath: !paths.length,
    };
  };

  // ---------------------------------------------------------------------------
  // Engine 1: Six Degrees of Wikipedia API
  // ---------------------------------------------------------------------------

  const cache = new Map();
  const cacheKey = (a, b) => U.normTitle(a) + '→' + U.normTitle(b);

  S.viaApi = async (source, target, { signal } = {}) => {
    const t0 = performance.now();
    let res;
    try {
      res = await fetch(SDOW_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source: U.normTitle(source), target: U.normTitle(target) }),
        signal,
      });
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      const err = new Error('Could not reach the Six Degrees of Wikipedia API.');
      err.network = true;
      throw err;
    }
    let data = null;
    try {
      data = await res.json();
    } catch (e) { /* non-JSON error page */ }
    if (!res.ok || !data) {
      const err = new Error((data && data.error) || `Six Degrees API error (HTTP ${res.status}).`);
      err.status = res.status;
      err.network = res.status >= 500 || res.status === 429;
      throw err;
    }
    const pages = data.pages || {};
    const paths = (data.paths || []).map((p) =>
      p.map((id) => {
        const pg = pages[id] || {};
        return { title: pg.title || String(id), description: pg.description || '', thumb: pg.thumbnailUrl || null };
      })
    );
    return {
      engine: 'sdow',
      source: data.sourcePageTitle || U.normTitle(source),
      target: data.targetPageTitle || U.normTitle(target),
      degrees: paths.length ? paths[0].length - 1 : null,
      paths,
      totalPaths: paths.length,
      approximate: false,
      ms: performance.now() - t0,
    };
  };

  // ---------------------------------------------------------------------------
  // Engine 2: live, in-browser BFS against the Wikipedia API
  // ---------------------------------------------------------------------------

  S.viaLive = async (source, target, { signal, onProgress = () => {}, maxRequests = 1500, maxPaths = 60 } = {}) => {
    const t0 = performance.now();
    const W = WS.wiki;
    const resolved = await W.resolve([source, target], { signal });
    const s = resolved.get(source);
    const t = resolved.get(target);
    if (!s) throw Object.assign(new Error(`Start page "${source}" does not exist on Wikipedia.`), { status: 400 });
    if (!t) throw Object.assign(new Error(`End page "${target}" does not exist on Wikipedia.`), { status: 400 });

    let requests = 0;
    const io = {
      outgoing: async (node) => {
        const r = await W.outgoingLinks(node, { signal, maxRequests: 6 });
        requests += r.requests;
        return r;
      },
      incoming: async (nodes) => {
        // The very first backward step (just the target) is allowed to dig deeper.
        const r = await W.incomingLinks(nodes, { signal, maxRequests: nodes.length === 1 ? 16 : 8 });
        requests += r.requests;
        return r;
      },
      probe: async (from, to) => {
        const r = await W.linksBetween(from, to, { signal, concurrency: 4 });
        requests += r.requests;
        return r.links;
      },
    };
    const r = await S.bidirectionalSearch(s, t, io, {
      signal,
      maxPaths,
      overBudget: () => requests >= maxRequests,
      onProgress: (p) => onProgress({ ...p, requests }),
    });

    // Decorate path nodes with descriptions + thumbnails.
    const titles = [...new Set(r.paths.flat())];
    const info = titles.length ? await W.pageInfo(titles, { signal }) : new Map();
    const paths = r.paths.map((p) =>
      p.map((title) => {
        const i = info.get(title) || {};
        return { title, description: i.description || '', thumb: i.thumb || null };
      })
    );
    return {
      engine: 'live',
      source: s,
      target: t,
      degrees: r.degrees,
      paths,
      totalPaths: paths.length,
      approximate: r.approximate || !!r.gaveUp,
      gaveUp: !!r.gaveUp,
      requests,
      ms: performance.now() - t0,
    };
  };

  // ---------------------------------------------------------------------------
  // Public entry points
  // ---------------------------------------------------------------------------

  /** engine: 'auto' (API, falling back to live), 'sdow', or 'live'. */
  S.find = async (source, target, { engine = 'auto', signal, onProgress, maxRequests } = {}) => {
    const key = cacheKey(source, target) + '|' + engine;
    if (cache.has(key)) return cache.get(key);
    let result;
    if (engine === 'live') {
      result = await S.viaLive(source, target, { signal, onProgress, maxRequests });
    } else {
      try {
        result = await S.viaApi(source, target, { signal });
      } catch (e) {
        // 400 = a page SDOW's snapshot doesn't know (e.g. brand new article); network = API down.
        if (engine === 'auto' && (e.status === 400 || e.network)) {
          onProgress && onProgress({ fallback: true, reason: e.message });
          result = await S.viaLive(source, target, { signal, onProgress, maxRequests });
          result.fallbackReason = e.message;
        } else throw e;
      }
    }
    cache.set(key, result);
    return result;
  };

  /** Degrees of separation from `from` to `target` (null if unknown / unreachable). API only; cached. */
  const distCache = new Map();
  S.distance = async (from, target, { signal } = {}) => {
    const key = cacheKey(from, target);
    if (U.normTitle(from) === U.normTitle(target)) return { degrees: 0, next: [] };
    if (!distCache.has(key)) {
      distCache.set(
        key,
        S.viaApi(from, target, { signal })
          .then((r) => ({
            degrees: r.degrees,
            // First hop of every shortest path — used for hints.
            next: [...new Set(r.paths.map((p) => p[1] && p[1].title).filter(Boolean))],
            result: r,
          }))
          .catch((e) => {
            distCache.delete(key);
            throw e;
          })
      );
    }
    return distCache.get(key);
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = WS;
})(typeof window !== 'undefined' ? window : globalThis);

/* Run history + settings. Local first (works offline / logged out), mirrored to Firestore when signed in. */
(function (root) {
  const WS = (root.WS = root.WS || {});
  const U = WS.util;
  const MAX_LOCAL = 300;

  const S = (WS.store = {});

  S.settings = () => ({ theme: 'auto', showPar: false, hideRefs: true, allowBack: false, allowFind: false, ...U.store.get('settings', {}) });
  S.setSetting = (k, v) => U.store.set('settings', { ...S.settings(), [k]: v });

  S.localRuns = () => U.store.get('runs', []);

  S.getRun = (id) => S.localRuns().find((r) => r.id === id) || (S._cloud || []).find((r) => r.id === id) || null;

  S.saveRun = async (run) => {
    const runs = S.localRuns().filter((r) => r.id !== run.id);
    runs.unshift(run);
    U.store.set('runs', runs.slice(0, MAX_LOCAL));
    try {
      await WS.fb.saveRun(run);
    } catch (e) {
      console.warn('cloud save failed', e);
    }
  };

  /** Patch fields on a saved run (e.g. once the optimal distance is known). */
  S.updateRun = async (id, patch) => {
    const runs = S.localRuns();
    const i = runs.findIndex((r) => r.id === id);
    let run = i >= 0 ? runs[i] : (S._cloud || []).find((r) => r.id === id);
    if (!run) return;
    run = Object.assign(run, patch);
    if (i >= 0) U.store.set('runs', runs);
    try {
      await WS.fb.saveRun(run);
    } catch (e) { /* ignore */ }
  };

  S.deleteRun = async (id) => {
    U.store.set('runs', S.localRuns().filter((r) => r.id !== id));
    if (S._cloud) S._cloud = S._cloud.filter((r) => r.id !== id);
    try { await WS.fb.deleteRun(id); } catch (e) { /* ignore */ }
  };

  /** Local + cloud runs, de-duplicated, newest first. Uploads local-only runs after sign-in. */
  S.allRuns = async () => {
    const local = S.localRuns();
    let cloud = [];
    try {
      cloud = await WS.fb.myRuns();
      S._cloud = cloud;
    } catch (e) {
      console.warn('cloud runs', e);
    }
    const byId = new Map();
    for (const r of cloud) byId.set(r.id, r);
    const toUpload = [];
    for (const r of local) {
      if (!byId.has(r.id)) {
        byId.set(r.id, r);
        if (WS.fb.user) toUpload.push(r);
      }
    }
    toUpload.slice(0, 50).forEach((r) => WS.fb.saveRun(r).catch(() => {}));
    return [...byId.values()].sort((a, b) => b.createdAt - a.createdAt);
  };

  // Daily attempt tracking (local). The server enforces first-attempt-only for signed-in players.
  S.dailyAttempt = (dateKey) => U.store.get('daily.' + dateKey, null);
  S.setDailyAttempt = (dateKey, run) =>
    U.store.set('daily.' + dateKey, { runId: run.id, finished: run.finished, clicks: run.clicks, timeMs: run.timeMs });

  S.streak = () => {
    let n = 0;
    const d = new Date();
    // Today counts if played; otherwise start from yesterday so the streak isn't "broken" yet.
    if (!S.dailyAttempt(U.todayKey(d))) d.setUTCDate(d.getUTCDate() - 1);
    for (;;) {
      const a = S.dailyAttempt(U.todayKey(d));
      if (!a || !a.finished) break;
      n++;
      d.setUTCDate(d.getUTCDate() - 1);
    }
    return n;
  };

  S.stats = (runs) => {
    const done = runs.filter((r) => r.finished);
    const withOpt = done.filter((r) => r.optimal);
    const avg = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null);
    return {
      played: runs.length,
      finished: done.length,
      avgClicks: avg(done.map((r) => r.clicks)),
      avgTime: avg(done.map((r) => r.timeMs)),
      bestTime: done.length ? Math.min(...done.map((r) => r.timeMs)) : null,
      perfect: withOpt.filter((r) => r.clicks <= r.optimal).length,
      efficiency: avg(withOpt.map((r) => Math.min(1, r.optimal / r.clicks))),
    };
  };
})(window);

/* Firebase Auth + Firestore. Loaded lazily from the CDN; the whole app works without it
 * (runs are always kept locally), login just adds cloud sync and the daily leaderboard. */
(function (root) {
  const WS = (root.WS = root.WS || {});
  const U = WS.util;
  const SDK = 'https://www.gstatic.com/firebasejs/12.3.0/';

  const FB = (WS.fb = { enabled: false, user: null, profile: null, error: null });
  const listeners = new Set();
  let m = {}; // loaded SDK functions
  let auth, db;

  FB.onChange = (fn) => {
    listeners.add(fn);
    return () => listeners.delete(fn);
  };
  const emit = () => listeners.forEach((fn) => { try { fn(FB.user, FB.profile); } catch (e) { console.error(e); } });

  async function loadConfig() {
    const c = root.WS_FIREBASE_CONFIG;
    if (c && c.apiKey) return { ...c };
    if (!/^https?:$/.test(location.protocol)) return null;
    try {
      // Firebase Hosting serves the project's web config here.
      const res = await fetch('/__/firebase/init.json', { cache: 'no-store' });
      if (res.ok && (res.headers.get('content-type') || '').includes('json')) return await res.json();
    } catch (e) { /* not on Firebase Hosting */ }
    return null;
  }

  FB.ready = (async () => {
    const cfg = await loadConfig();
    if (!cfg) return false;
    // Serve the auth handler from our own domain so sign-in works with third-party cookies blocked.
    if (/\.(web\.app|firebaseapp\.com)$/.test(location.hostname)) cfg.authDomain = location.hostname;
    const [app, a, f] = await Promise.all([
      import(SDK + 'firebase-app.js'),
      import(SDK + 'firebase-auth.js'),
      import(SDK + 'firebase-firestore.js'),
    ]);
    m = { ...app, ...a, ...f };
    const fbApp = m.initializeApp(cfg);
    auth = m.getAuth(fbApp);
    db = m.getFirestore(fbApp);
    FB.enabled = true;
    m.getRedirectResult(auth).catch((e) => U.toast(friendly(e), 'bad'));
    await new Promise((resolve) => {
      let first = true;
      m.onAuthStateChanged(auth, async (user) => {
        FB.user = user;
        FB.profile = null;
        if (user) {
          try {
            FB.profile = await ensureProfile(user);
          } catch (e) {
            console.warn('profile', e);
            FB.profile = { displayName: displayNameFor(user), photoURL: user.photoURL || null };
          }
        }
        emit();
        if (first) {
          first = false;
          resolve();
        }
      });
    });
    return true;
  })().catch((e) => {
    console.warn('Firebase unavailable:', e);
    FB.error = e;
    return false;
  });

  function displayNameFor(user) {
    if (user.displayName) return user.displayName.slice(0, 32);
    if (user.email) return user.email.split('@')[0].slice(0, 32);
    return 'Guest ' + user.uid.slice(0, 4).toUpperCase();
  }

  async function ensureProfile(user) {
    const ref = m.doc(db, 'users', user.uid);
    const snap = await m.getDoc(ref);
    if (snap.exists()) return snap.data();
    const profile = {
      displayName: displayNameFor(user),
      photoURL: user.photoURL || null,
      guest: user.isAnonymous,
      createdAt: m.serverTimestamp(),
    };
    await m.setDoc(ref, profile);
    return profile;
  }

  function friendly(e) {
    const code = (e && e.code) || '';
    const map = {
      'auth/popup-closed-by-user': 'Sign-in cancelled.',
      'auth/cancelled-popup-request': 'Sign-in cancelled.',
      'auth/invalid-credential': 'Wrong email or password.',
      'auth/wrong-password': 'Wrong email or password.',
      'auth/user-not-found': 'No account with that email.',
      'auth/email-already-in-use': 'That email already has an account — sign in instead.',
      'auth/weak-password': 'Password must be at least 6 characters.',
      'auth/invalid-email': 'That email address looks wrong.',
      'auth/operation-not-allowed': 'This sign-in method is not enabled in the Firebase console.',
      'auth/unauthorized-domain': 'This domain is not authorized for sign-in (add it in Firebase → Auth → Settings).',
      'auth/network-request-failed': 'Network error — check your connection.',
      'auth/too-many-requests': 'Too many attempts. Try again later.',
      'auth/admin-restricted-operation': 'Guest sign-in is not enabled in the Firebase console.',
    };
    return map[code] || (e && e.message) || 'Something went wrong.';

  FB.friendly = friendly;

  async function need() {
    const ok = await FB.ready;
    if (!ok) throw new Error('Login is not configured for this copy of WikiSpeedruns.');
  }

  FB.signInGoogle = async () => {
    await need();
    const provider = new m.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    const cur = auth.currentUser;
    try {
      // Upgrading a guest keeps their history.
      if (cur && cur.isAnonymous) {
        try {
          await m.linkWithPopup(cur, provider);
          await m.updateDoc(m.doc(db, 'users', cur.uid), { guest: false, displayName: displayNameFor(auth.currentUser), photoURL: auth.currentUser.photoURL || null });
          FB.profile = (await m.getDoc(m.doc(db, 'users', cur.uid))).data();
          emit();
          return;
        } catch (e) {
          if (e.code !== 'auth/credential-already-in-use') throw e;
          const cred = m.GoogleAuthProvider.credentialFromError(e);
          if (cred) return void (await m.signInWithCredential(auth, cred));
        }
      }
      if (U.isStandalone()) return void (await m.signInWithRedirect(auth, provider));
      await m.signInWithPopup(auth, provider);
    } catch (e) {
      if (e.code === 'auth/popup-blocked') return void (await m.signInWithRedirect(auth, provider));
      throw new Error(friendly(e));
    }
  };

  FB.signInEmail = async (email, password, create) => {
    await need();
    try {
      if (create) {
        const cur = auth.currentUser;
        if (cur && cur.isAnonymous) {
          await m.linkWithCredential(cur, m.EmailAuthProvider.credential(email, password));
          await m.updateDoc(m.doc(db, 'users', cur.uid), { guest: false, displayName: email.split('@')[0].slice(0, 32) });
          FB.profile = (await m.getDoc(m.doc(db, 'users', cur.uid))).data();
          emit();
        } else {
          await m.createUserWithEmailAndPassword(auth, email, password);
        }
      } else {
        await m.signInWithEmailAndPassword(auth, email, password);
      }
    } catch (e) {
      throw new Error(friendly(e));
    }
  };

  FB.resetPassword = async (email) => {
    await need();
    try {
      await m.sendPasswordResetEmail(auth, email);
    } catch (e) {
      throw new Error(friendly(e));
    }
  };

  FB.signInGuest = async () => {
    await need();
    try {
      await m.signInAnonymously(auth);
    } catch (e) {
      throw new Error(friendly(e));
    }
  };

  FB.signOut = async () => {
    await need();
    await m.signOut(auth);
  };

  FB.setDisplayName = async (name) => {
    await need();
    name = String(name).trim().slice(0, 32);
    if (!name) throw new Error('Name cannot be empty.');
    await m.updateDoc(m.doc(db, 'users', FB.user.uid), { displayName: name });
    try { await m.updateProfile(FB.user, { displayName: name }); } catch (e) { /* guest accounts */ }
    FB.profile = { ...FB.profile, displayName: name };
    emit();
  };

  // ---------------- Runs & leaderboard ----------------

  const clean = (run) => JSON.parse(JSON.stringify(run)); // drop undefined

  FB.saveRun = async (run) => {
    if (!(await FB.ready) || !FB.user) return false;
    await m.setDoc(m.doc(db, 'users', FB.user.uid, 'runs', run.id), clean(run));
    return true;
  };

  FB.myRuns = async (max = 200) => {
    if (!(await FB.ready) || !FB.user) return [];
    const q = m.query(m.collection(db, 'users', FB.user.uid, 'runs'), m.orderBy('createdAt', 'desc'), m.limit(max));
    const snap = await m.getDocs(q);
    return snap.docs.map((d) => d.data());
  };

  FB.deleteRun = async (id) => {
    if (!(await FB.ready) || !FB.user) return;
    await m.deleteDoc(m.doc(db, 'users', FB.user.uid, 'runs', id));
  };

  /** First attempt of the day goes on the board. Returns 'ok' | 'exists' | 'offline'. */
  FB.submitDaily = async (dateKey, run) => {
    if (!(await FB.ready) || !FB.user) return 'offline';
    const ref = m.doc(db, 'daily', dateKey, 'entries', FB.user.uid);
    const entry = {
      uid: FB.user.uid,
      displayName: (FB.profile && FB.profile.displayName) || displayNameFor(FB.user),
      photoURL: (FB.profile && FB.profile.photoURL) || null,
      finished: !!run.finished,
      path: run.path.map((p) => p.title).slice(0, 500),
      optimal: run.optimal ?? null,
      runId: run.id,
      createdAt: m.serverTimestamp(),
    };
    // Unfinished runs leave clicks/timeMs out entirely, so orderBy() skips them on the board.
    if (run.finished) {
      entry.clicks = run.clicks;
      entry.timeMs = Math.round(run.timeMs);
    }
    try {
      await m.runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        if (snap.exists()) throw Object.assign(new Error('exists'), { code: 'exists' });
        tx.set(ref, entry);
      });
      return 'ok';
    } catch (e) {
      if (e.code === 'exists') return 'exists';
      console.warn('daily submit', e);
      return 'error';
    }
  };

  FB.myDailyEntry = async (dateKey) => {
    if (!(await FB.ready) || !FB.user) return null;
    const snap = await m.getDoc(m.doc(db, 'daily', dateKey, 'entries', FB.user.uid));
    return snap.exists() ? snap.data() : null;
  };

  FB.leaderboard = async (dateKey, by = 'time', max = 100) => {
    if (!(await FB.ready)) return null;
    const col = m.collection(db, 'daily', dateKey, 'entries');
    const q = by === 'clicks'
      ? m.query(col, m.orderBy('clicks'), m.orderBy('timeMs'), m.limit(max))
      : m.query(col, m.orderBy('timeMs'), m.limit(max));
    const snap = await m.getDocs(q);
    return snap.docs.map((d) => d.data());
  };

  FB.dailyCount = async (dateKey) => {
    if (!(await FB.ready)) return null;
    try {
      const snap = await m.getCountFromServer(m.collection(db, 'daily', dateKey, 'entries'));
      return snap.data().count;
    } catch (e) {
      return null;
    }
  };
})(window);

/* Reusable UI bits: page cards, autocomplete, path rows, the distance chart, confetti. */
(function (root) {
  const WS = (root.WS = root.WS || {});
  const U = WS.util;
  const esc = U.esc;
  const C = (WS.ui = {});

  const thumbStyle = (url) => (url ? `style="background-image:url('${esc(url)}')"` : '');
  const initial = (t) => esc((t || '?').trim()[0] || '?');

  C.thumb = (info, cls = 'thumb') =>
    `<div class="${cls}" ${thumbStyle(info && info.thumb)}>${info && info.thumb ? '' : initial(info && info.title)}</div>`;

  /** Card for an article. info: {title, description, thumb, extract}. */
  C.pageCard = (info, { label = '', target = false, big = false, link = false } = {}) => {
    const tag = link ? 'a' : 'div';
    const href = link ? ` href="${esc(U.wikiUrl(info.title))}" target="_blank" rel="noopener"` : '';
    return `<${tag} class="page-card ${target ? 'target' : ''} ${big ? 'big' : ''}"${href}>
      ${C.thumb(info)}
      <div class="meta">
        ${label ? `<div class="label">${esc(label)}</div>` : ''}
        <div class="title">${esc(info.title)}</div>
        ${info.description ? `<div class="desc">${esc(info.description)}</div>` : ''}
      </div></${tag}>`;
  };

  C.pageCardSkeleton = (label, target) => `<div class="page-card ${target ? 'target' : ''}">
      <div class="thumb skeleton"></div><div class="meta" style="flex:1">
      <div class="label">${esc(label)}</div><div class="skeleton" style="height:18px;width:70%;margin:4px 0"></div>
      <div class="skeleton" style="height:12px;width:90%"></div></div></div>`;

  C.pathNode = (n, { visited = false, endpoint = false } = {}) =>
    `<a class="path-node ${visited ? 'visited' : ''} ${endpoint ? 'endpoint' : ''}" href="${esc(U.wikiUrl(n.title))}" target="_blank" rel="noopener" title="${esc(n.description || n.title)}">
      ${C.thumb(n)}<span class="t">${esc(n.title)}</span></a>`;

  C.pathRow = (path, i, mine = new Set()) =>
    `<div class="path-row"><span class="n">${i + 1}.</span>${path
      .map((n, j) => C.pathNode(n, { visited: j > 0 && j < path.length - 1 && mine.has(n.title), endpoint: j === 0 || j === path.length - 1 }))
      .join('<span class="path-arrow">→</span>')}</div>`;

  C.avatar = (name, photo) =>
    photo
      ? `<span class="avatar" style="background-image:url('${esc(photo)}')"></span>`
      : `<span class="avatar">${initial(name)}</span>`;

  /** Article-title autocomplete on an <input>. onPick(title) fires on selection. */
  C.autocomplete = (input, { onPick, onEnter } = {}) => {
    const wrap = input.closest('.ac');
    const list = document.createElement('div');
    list.className = 'ac-list hidden';
    wrap.appendChild(list);
    let items = [];
    let active = -1;
    let ctrl;
    const close = () => {
      list.classList.add('hidden');
      active = -1;
    };
    const draw = () => {
      if (!items.length) return close();
      list.innerHTML = items
        .map((it, i) => `<div class="ac-item ${i === active ? 'on' : ''}" data-i="${i}">${C.thumb(it)}<div><div class="t">${esc(it.title)}</div><div class="d">${esc(it.description)}</div></div></div>`)
        .join('');
      list.classList.remove('hidden');
    };
    const pick = (it) => {
      input.value = it.title;
      close();
      onPick && onPick(it.title, it);
    };
    const search = U.debounce(async () => {
      ctrl && ctrl.abort();
      ctrl = new AbortController();
      const q = input.value;
      if (!q.trim()) return close();
      try {
        items = await WS.wiki.search(q, { signal: ctrl.signal });
        active = -1;
        if (document.activeElement === input) draw();
      } catch (e) { /* aborted or offline */ }
    }, 180);
    input.setAttribute('autocomplete', 'off');
    input.setAttribute('spellcheck', 'false');
    input.addEventListener('input', search);
    input.addEventListener('keydown', (e) => {
      const open = !list.classList.contains('hidden');
      if (e.key === 'ArrowDown' && open) {
        active = Math.min(items.length - 1, active + 1);
        draw();
        e.preventDefault();
      } else if (e.key === 'ArrowUp' && open) {
        active = Math.max(0, active - 1);
        draw();
        e.preventDefault();
      } else if (e.key === 'Enter') {
        if (open && active >= 0) {
          pick(items[active]);
          e.preventDefault();
        } else {
          close();
          onEnter && onEnter();
        }
      } else if (e.key === 'Escape') close();
    });
    input.addEventListener('blur', () => setTimeout(close, 150));
    list.addEventListener('mousedown', (e) => {
      const el = e.target.closest('.ac-item');
      if (el) {
        e.preventDefault();
        pick(items[+el.dataset.i]);
      }
    });
  };

  /**
   * Step chart: distance-to-target after each click, against the ideal straight line.
   * dists: array (null = unknown) aligned with the path.
   */
  C.distanceChart = (dists, labels) => {
    const known = dists.filter((d) => d != null);
    if (known.length < 2) return '';
    const n = dists.length;
    const maxD = Math.max(...known, 1);
    const W = 520, H = 190, padL = 30, padR = 12, padT = 14, padB = 26;
    const x = (i) => padL + (n === 1 ? 0 : (i * (W - padL - padR)) / (n - 1));
    const y = (d) => padT + ((maxD - d) * (H - padT - padB)) / maxD;
    let grid = '';
    for (let d = 0; d <= maxD; d++) {
      grid += `<line x1="${padL}" x2="${W - padR}" y1="${y(d)}" y2="${y(d)}" stroke="var(--border)" stroke-dasharray="${d ? '3 4' : ''}"/>`;
      grid += `<text x="${padL - 8}" y="${y(d) + 4}" text-anchor="end" font-size="13" fill="var(--muted)" font-family="var(--mono)">${d}</text>`;
    }
    const d0 = dists[0];
    const ideal = d0 != null ? `<line x1="${x(0)}" y1="${y(d0)}" x2="${x(Math.min(d0, n - 1))}" y2="${y(0)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5" opacity=".7"/>` : '';
    let line = '';
    let dots = '';
    let prev = null;
    dists.forEach((d, i) => {
      if (d == null) return;
      if (prev) line += `<line x1="${x(prev.i)}" y1="${y(prev.d)}" x2="${x(i)}" y2="${y(d)}" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>`;
      const cls = i === 0 ? 'var(--muted)' : d === 0 ? 'var(--hot)' : prev && d < prev.d ? 'var(--good)' : prev && d > prev.d ? 'var(--bad)' : 'var(--warn)';
      dots += `<circle cx="${x(i)}" cy="${y(d)}" r="7" fill="${cls}" stroke="var(--surface)" stroke-width="2"><title>${esc(labels[i])}: ${d} away</title></circle>`;
      prev = { i, d };
    });
    const xl = dists.map((_, i) => (n <= 16 || i % Math.ceil(n / 16) === 0 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="var(--mono)">${i}</text>` : '')).join('');
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Distance to target after each click">${grid}${ideal}${line}${dots}${xl}</svg>
      <div class="legend" style="justify-content:center;margin-top:6px">
        <span><i style="background:var(--accent)"></i>Ideal pace</span><span><i style="background:var(--good)"></i>Closer</span>
        <span><i style="background:var(--warn)"></i>Same</span><span><i style="background:var(--bad)"></i>Further</span></div></div>`;
  };

  C.confetti = () => {
    if (root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = document.createElement('canvas');
    cv.className = 'confetti';
    document.body.appendChild(cv);
    const ctx = cv.getContext('2d');
    const dpr = root.devicePixelRatio || 1;
    cv.width = innerWidth * dpr;
    cv.height = innerHeight * dpr;
    ctx.scale(dpr, dpr);
    const colors = ['#3a63f0', '#ff6a1a', '#16955a', '#f0b429', '#d23f3f', '#8f5cf7'];
    const ps = Array.from({ length: 160 }, () => ({
      x: innerWidth / 2 + (Math.random() - 0.5) * 120,
      y: innerHeight * 0.35,
      vx: (Math.random() - 0.5) * 14,
      vy: -Math.random() * 14 - 4,
      r: Math.random() * 6 + 4,
      a: Math.random() * Math.PI,
      va: (Math.random() - 0.5) * 0.3,
      c: colors[(Math.random() * colors.length) | 0],
    }));
    const t0 = performance.now();
    const frame = (t) => {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const p of ps) {
        p.vy += 0.35;
        p.vx *= 0.99;
        p.x += p.vx;
        p.y += p.vy;
        p.a += p.va;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.a);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
        ctx.restore();
      }
      if (t - t0 < 3200) requestAnimationFrame(frame);
      else cv.remove();
    };
    requestAnimationFrame(frame);
  };
})(window);

  <script>
/* Layered SVG graph of shortest paths. Every node on a shortest path has one fixed distance
 * from the start, so the paths form a DAG we can draw in neat columns (one per degree). */
(function (root) {
  const WS = (root.WS = root.WS || {});
  const U = WS.util;
  const NS = 'http://www.w3.org/2000/svg';

  const trunc = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

  /**
   * paths: [[{title}, ...], ...] all the same length.
   * opts.mine: Set of titles the player visited; opts.mineEdges: Set of "a\u0001b" they clicked.
   */
  function render(container, paths, opts = {}) {
    container.innerHTML = '';
    if (!paths.length) return;
    const mine = opts.mine || new Set();
    const mineEdges = opts.mineEdges || new Set();
    const L = paths[0].length;
    const vertical = opts.vertical ?? container.clientWidth < 700;

    // Build layers.
    const nodes = new Map();
    const layers = Array.from({ length: L }, () => []);
    const edges = new Map();
    for (const p of paths) {
      p.forEach((n, i) => {
        if (!nodes.has(n.title)) {
          const node = { title: n.title, info: n, layer: i, parents: new Set(), children: new Set(), pos: 0 };
          nodes.set(n.title, node);
          layers[i].push(node);
        }
        if (i > 0) {
          const a = nodes.get(p[i - 1].title);
          const b = nodes.get(n.title);
          a.children.add(b);
          b.parents.add(a);
          edges.set(a.title + '\u0001' + b.title, [a, b]);
        }
      });
    }

    // Barycenter ordering, a few down/up sweeps to reduce crossings.
    layers.forEach((layer) => layer.forEach((n, i) => (n.pos = i)));
    const sweep = (li, key) => {
      const layer = layers[li];
      for (const n of layer) {
        const nb = [...n[key]];
        n.bary = nb.length ? nb.reduce((s, x) => s + x.pos, 0) / nb.length : n.pos;
      }
      layer.sort((a, b) => a.bary - b.bary || a.title.localeCompare(b.title));
      layer.forEach((n, i) => (n.pos = i));
    };
    for (let it = 0; it < 4; it++) {
      for (let i = 1; i < L; i++) sweep(i, 'parents');
      for (let i = L - 2; i >= 0; i--) sweep(i, 'children');
    }

    // Geometry.
    const nodeW = vertical ? 132 : 164;
    const nodeH = 30;
    const along = vertical ? 78 : 210; // distance between layers
    const across = vertical ? nodeW + 12 : nodeH + 14; // distance between siblings
    const maxN = Math.max(...layers.map((l) => l.length));
    const pad = 24;
    const spanAcross = maxN * across;
    const W = vertical ? spanAcross + pad * 2 : (L - 1) * along + nodeW + pad * 2;
    const H = vertical ? (L - 1) * along + nodeH + pad * 2 + 16 : spanAcross + pad * 2 + 16;
    const place = (n) => {
      const layerLen = layers[n.layer].length;
      const offset = (spanAcross - layerLen * across) / 2 + n.pos * across + across / 2;
      if (vertical) return { x: pad + offset, y: pad + 16 + n.layer * along + nodeH / 2 };
      return { x: pad + nodeW / 2 + n.layer * along, y: pad + 16 + offset };
    };
    nodes.forEach((n) => Object.assign(n, place(n)));

    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', `Graph of ${paths.length} shortest paths`);

    // Degree labels.
    if (!vertical) {
      for (let i = 0; i < L; i++) {
        const t = document.createElementNS(NS, 'text');
        t.setAttribute('class', 'g-layer-label');
        t.setAttribute('x', pad + nodeW / 2 + i * along);
        t.setAttribute('y', pad);
        t.setAttribute('text-anchor', 'middle');
        t.textContent = i === 0 ? 'START' : i === L - 1 ? 'TARGET' : `DEGREE ${i}`;
        svg.appendChild(t);
      }
    }

    const edgeEls = [];
    const gEdges = document.createElementNS(NS, 'g');
    for (const [key, [a, b]] of edges) {
      const path = document.createElementNS(NS, 'path');
      let d;
      if (vertical) {
        const y1 = a.y + nodeH / 2, y2 = b.y - nodeH / 2, my = (y1 + y2) / 2;
        d = `M${a.x},${y1} C${a.x},${my} ${b.x},${my} ${b.x},${y2}`;
      } else {
        const x1 = a.x + nodeW / 2, x2 = b.x - nodeW / 2, mx = (x1 + x2) / 2;
        d = `M${x1},${a.y} C${mx},${a.y} ${mx},${b.y} ${x2},${b.y}`;
      }
      path.setAttribute('d', d);
      path.setAttribute('class', 'g-edge' + (mineEdges.has(key) ? ' mine' : ''));
      path._a = a;
      path._b = b;
      gEdges.appendChild(path);
      edgeEls.push(path);
    }
    svg.appendChild(gEdges);

    const nodeEls = [];
    for (const n of nodes.values()) {
      const g = document.createElementNS(NS, 'g');
      const cls = ['g-node'];
      if (n.layer === 0 || n.layer === L - 1) cls.push('endpoint');
      else if (mine.has(n.title)) cls.push('mine');
      g.setAttribute('class', cls.join(' '));
      g.setAttribute('transform', `translate(${n.x - nodeW / 2},${n.y - nodeH / 2})`);
      g.setAttribute('tabindex', '0');
      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('width', nodeW);
      rect.setAttribute('height', nodeH);
      rect.setAttribute('rx', 15);
      const text = document.createElementNS(NS, 'text');
      text.setAttribute('x', nodeW / 2);
      text.setAttribute('y', nodeH / 2 + 4);
      text.setAttribute('text-anchor', 'middle');
      text.textContent = trunc(n.title, vertical ? 18 : 23);
      const title = document.createElementNS(NS, 'title');
      title.textContent = n.title + (n.info.description ? ' — ' + n.info.description : '');
      g.append(rect, text, title);
      g._node = n;
      svg.appendChild(g);
      nodeEls.push(g);
    }

    // Highlight every path through a node (tap on mobile, hover on desktop).
    let pinned = null;
    const highlight = (n) => {
      if (!n) {
        svg.classList.remove('g-dim');
        nodeEls.forEach((g) => g.classList.remove('hl'));
        edgeEls.forEach((e) => e.classList.remove('hl'));
        return;
      }
      const on = new Set([n]);
      const up = (x) => x.parents.forEach((p) => { if (!on.has(p)) { on.add(p); up(p); } });
      const down = (x) => x.children.forEach((c) => { if (!on.has(c)) { on.add(c); down(c); } });
      up(n);
      down(n);
      svg.classList.add('g-dim');
      nodeEls.forEach((g) => g.classList.toggle('hl', on.has(g._node)));
      edgeEls.forEach((e) => e.classList.toggle('hl', on.has(e._a) && on.has(e._b)));
    };
    nodeEls.forEach((g) => {
      g.addEventListener('mouseenter', () => !pinned && highlight(g._node));
      g.addEventListener('mouseleave', () => !pinned && highlight(null));
      g.addEventListener('click', () => {
        pinned = pinned === g._node ? null : g._node;
        highlight(pinned);
        opts.onNode && opts.onNode(g._node.info, !!pinned);
      });
      g.addEventListener('dblclick', () => window.open(U.wikiUrl(g._node.title), '_blank', 'noopener'));
    });

    container.appendChild(svg);
  }

  WS.graph = { render };
})(window);
